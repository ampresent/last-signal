<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST SIGNAL — 光照开发系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    color: #c0c0c0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
  }

  /* ── Layout ─────────────────────────── */
  #app {
    display: flex;
    height: 100vh;
  }
  #preview-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    min-width: 0;
  }
  #sidebar {
    width: 360px;
    background: #0e0e1a;
    border-left: 1px solid #1a1a2e;
    overflow-y: auto;
    padding: 16px;
    flex-shrink: 0;
  }

  /* ── Preview Canvas ─────────────────── */
  #canvas-wrap {
    position: relative;
    background: #000;
    border: 1px solid #1a1a2e;
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #lighting-canvas {
    display: block;
    width: 960px;
    height: 640px;
    image-rendering: auto;
    cursor: crosshair;
  }
  /* Coordinate overlay */
  #coord-overlay {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.7);
    color: #00ff88;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 3px;
    pointer-events: none;
    display: none;
  }
  /* Light marker overlay */
  #marker-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 960px; height: 640px;
    pointer-events: none;
  }

  /* ── Toolbar ────────────────────────── */
  #toolbar {
    display: flex;
    gap: 8px;
    padding: 12px 0;
    align-items: center;
    flex-wrap: wrap;
  }
  .tb-btn {
    background: rgba(0,255,136,0.08);
    border: 1px solid #00ff8844;
    color: #00ff88;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .tb-btn:hover { background: rgba(0,255,136,0.18); }
  .tb-btn.active { background: rgba(0,255,136,0.25); border-color: #00ff88; }
  .tb-btn.danger { color: #ff4466; border-color: #ff446644; }
  .tb-btn.danger:hover { background: rgba(255,68,102,0.15); }
  .tb-sep { width: 1px; height: 24px; background: #1a1a2e; }

  /* ── Time display ───────────────────── */
  #time-display {
    color: #666;
    font-size: 11px;
    margin-left: auto;
  }

  /* ── Sidebar sections ───────────────── */
  .section-title {
    color: #00ff88;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 16px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid #1a1a2e;
  }
  .section-title:first-child { margin-top: 0; }

  /* ── Scene selector ─────────────────── */
  #scene-select {
    width: 100%;
    background: #12121e;
    border: 1px solid #1a1a2e;
    color: #c0c0c0;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
    border-radius: 3px;
    cursor: pointer;
  }
  #scene-select:focus { border-color: #00ff8844; outline: none; }

  /* ── Light list ─────────────────────── */
  #light-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .light-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: #12121e;
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.1s;
    font-size: 12px;
  }
  .light-item:hover { border-color: #1a1a3e; }
  .light-item.selected { border-color: #00ff8844; background: rgba(0,255,136,0.06); }
  .light-swatch {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid #333;
    flex-shrink: 0;
  }
  .light-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .light-type-badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 2px;
    background: #1a1a2e;
    color: #666;
    text-transform: uppercase;
  }
  .light-remove {
    color: #444;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: color 0.15s;
  }
  .light-remove:hover { color: #ff4466; }

  /* ── Property panel ─────────────────── */
  #props-panel {
    display: none;
  }
  #props-panel.visible { display: block; }
  .prop-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .prop-label {
    width: 65px;
    font-size: 11px;
    color: #888;
    flex-shrink: 0;
    text-align: right;
  }
  .prop-input {
    flex: 1;
    background: #0a0a14;
    border: 1px solid #1a1a2e;
    color: #c0c0c0;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
  }
  .prop-input:focus { border-color: #00ff8844; outline: none; }
  .prop-input[type="number"] { width: 70px; flex: none; }
  .prop-input[type="color"] { width: 40px; height: 28px; padding: 2px; cursor: pointer; }

  .prop-group {
    background: #0a0a14;
    border: 1px solid #1a1a2e;
    border-radius: 3px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .prop-group-title {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  select.prop-input {
    cursor: pointer;
  }

  /* ── Status bar ─────────────────────── */
  #status-bar {
    padding: 8px 0;
    font-size: 11px;
    color: #444;
    border-top: 1px solid #1a1a2e;
    margin-top: 12px;
  }
  #status-bar .ok { color: #00ff88; }

  /* ── Scrollbar ──────────────────────── */
  #sidebar::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 3px; }

  /* ── Toast ──────────────────────────── */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #00ff88;
    color: #0a0a14;
    padding: 8px 20px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    transition: transform 0.3s ease;
    z-index: 999;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <!-- Preview Area -->
  <div id="preview-area">
    <div id="toolbar">
      <button class="tb-btn" id="btn-play" title="播放/暂停动画">⏵ 播放</button>
      <button class="tb-btn" id="btn-reset" title="重置时间">↺ 重置</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="btn-add-point" title="添加点光源">+ 点光源</button>
      <button class="tb-btn" id="btn-add-dir" title="添加方向光">+ 方向光</button>
      <button class="tb-btn" id="btn-add-global" title="添加全局光">+ 全局光</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="btn-save" title="保存配置到 JSON">💾 保存</button>
      <button class="tb-btn" id="btn-export-frame" title="导出当前帧为 PNG">📷 导出帧</button>
      <div class="tb-sep"></div>
      <button class="tb-btn danger" id="btn-reset-scene" title="重置当前场景光源为默认值">⚠ 重置场景</button>
      <div id="time-display">t = 0.00s</div>
    </div>

    <div id="canvas-wrap">
      <canvas id="lighting-canvas" width="960" height="640"></canvas>
      <canvas id="marker-overlay" width="960" height="640"></canvas>
      <div id="coord-overlay"></div>
    </div>

    <div id="status-bar">
      <span class="ok">●</span> 光照引擎就绪 — 选择场景开始编辑
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="section-title">场景</div>
    <select id="scene-select">
      <option value="">-- 选择场景 --</option>
    </select>

    <div class="section-title">光源列表 <span id="light-count" style="float:right;color:#444">0</span></div>
    <div id="light-list"></div>

    <div class="section-title">光源属性</div>
    <div id="props-panel">
      <div class="prop-row">
        <span class="prop-label">名称</span>
        <input class="prop-input" id="p-name" type="text">
      </div>
      <div class="prop-row">
        <span class="prop-label">类型</span>
        <select class="prop-input" id="p-type">
          <option value="point">点光源</option>
          <option value="directional">方向光</option>
          <option value="global">全局光</option>
        </select>
      </div>

      <!-- Position (point lights) -->
      <div class="prop-group" id="g-position">
        <div class="prop-group-title">位置 (归一化 0-1)</div>
        <div class="prop-row">
          <span class="prop-label">X</span>
          <input class="prop-input" id="p-x" type="number" step="0.01" min="0" max="1">
          <span class="prop-label">Y</span>
          <input class="prop-input" id="p-y" type="number" step="0.01" min="0" max="1">
        </div>
        <div class="prop-row">
          <span class="prop-label">深度</span>
          <input class="prop-input" id="p-depth" type="number" step="0.01" min="0" max="1" value="0.3">
        </div>
      </div>

      <!-- Direction (directional lights) -->
      <div class="prop-group" id="g-direction">
        <div class="prop-group-title">方向</div>
        <div class="prop-row">
          <span class="prop-label">DX</span>
          <input class="prop-input" id="p-dx" type="number" step="0.1" value="1">
          <span class="prop-label">DY</span>
          <input class="prop-input" id="p-dy" type="number" step="0.1" value="0.3">
        </div>
      </div>

      <!-- Color & Intensity -->
      <div class="prop-group">
        <div class="prop-group-title">颜色 & 强度</div>
        <div class="prop-row">
          <span class="prop-label">颜色</span>
          <input class="prop-input" id="p-color" type="color" value="#8888ff">
          <span id="p-color-hex" style="font-size:11px;color:#666">#8888ff</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">强度</span>
          <input class="prop-input" id="p-intensity" type="number" step="0.01" min="0" max="2" value="0.3">
        </div>
        <div class="prop-row">
          <span class="prop-label">半径</span>
          <input class="prop-input" id="p-radius" type="number" step="10" min="10" max="1000" value="150">
        </div>
      </div>

      <!-- Animation -->
      <div class="prop-group">
        <div class="prop-group-title">动画相位</div>
        <div class="prop-row">
          <span class="prop-label">类型</span>
          <select class="prop-input" id="p-phase-type">
            <option value="steady">恒定</option>
            <option value="sine">正弦</option>
            <option value="pulse">脉冲</option>
            <option value="flicker">闪烁</option>
            <option value="car_sweep">车灯扫过</option>
            <option value="lightning">闪电</option>
          </select>
        </div>
        <div class="prop-row">
          <span class="prop-label">速度</span>
          <input class="prop-input" id="p-phase-speed" type="number" step="0.1" min="0" max="10" value="1.0">
        </div>
        <div class="prop-row">
          <span class="prop-label">最小值</span>
          <input class="prop-input" id="p-phase-min" type="number" step="0.01" min="0" max="1" value="0.1">
          <span class="prop-label">最大值</span>
          <input class="prop-input" id="p-phase-max" type="number" step="0.01" min="0" max="1" value="0.4">
        </div>
        <div class="prop-row">
          <span class="prop-label">偏移</span>
          <input class="prop-input" id="p-phase-offset" type="number" step="0.1" min="0" max="10" value="0">
        </div>
      </div>
    </div>
    <div id="props-empty" style="color:#444;font-size:12px;padding:16px 0;">
      点击左侧光源列表中的项目查看属性
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="lighting-engine.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
// LIGHTING EDITOR — Scene/light management & live preview
// ══════════════════════════════════════════════════════════════════

const Editor = {
  engine: null,
  config: null,
  defaultConfig: null,
  currentScene: null,
  selectedLightId: null,
  playing: true,
  mouseUV: { x: 0, y: 0 },

  async init() {
    const canvas = document.getElementById('lighting-canvas');
    this.engine = new LightingEngine(canvas);
    this.engine.onUpdate = (t) => this._onFrame(t);

    // Load config
    const resp = await fetch('lighting-config.json');
    this.config = await resp.json();
    this.defaultConfig = JSON.parse(JSON.stringify(this.config));

    // Populate scene selector
    const sel = document.getElementById('scene-select');
    for (const [id, scene] of Object.entries(this.config.scenes)) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = `${scene.name} (${id})`;
      sel.appendChild(opt);
    }

    // Event bindings
    sel.addEventListener('change', () => this.selectScene(sel.value));
    canvas.addEventListener('mousemove', (e) => this._onMouseMove(e));
    canvas.addEventListener('click', (e) => this._onCanvasClick(e));

    document.getElementById('btn-play').addEventListener('click', () => this.togglePlay());
    document.getElementById('btn-reset').addEventListener('click', () => this.resetTime());
    document.getElementById('btn-add-point').addEventListener('click', () => this.addLight('point'));
    document.getElementById('btn-add-dir').addEventListener('click', () => this.addLight('directional'));
    document.getElementById('btn-add-global').addEventListener('click', () => this.addLight('global'));
    document.getElementById('btn-save').addEventListener('click', () => this.saveConfig());
    document.getElementById('btn-export-frame').addEventListener('click', () => this.exportFrame());
    document.getElementById('btn-reset-scene').addEventListener('click', () => this.resetScene());

    // Property change listeners
    const propInputs = [
      'p-name', 'p-type', 'p-x', 'p-y', 'p-depth', 'p-dx', 'p-dy',
      'p-color', 'p-intensity', 'p-radius',
      'p-phase-type', 'p-phase-speed', 'p-phase-min', 'p-phase-max', 'p-phase-offset'
    ];
    for (const id of propInputs) {
      const el = document.getElementById(id);
      const event = el.type === 'color' ? 'input' : 'change';
      el.addEventListener(event, () => this._onPropChange());
    }

    // Load first scene
    const firstScene = Object.keys(this.config.scenes)[0];
    sel.value = firstScene;
    this.selectScene(firstScene);
  },

  async selectScene(sceneId) {
    if (!sceneId || !this.config.scenes[sceneId]) return;
    this.currentScene = sceneId;
    this.selectedLightId = null;

    try {
      await this.engine.loadScene(sceneId, this.config);
      this.engine.start();
      this.playing = true;
      document.getElementById('btn-play').textContent = '⏸ 暂停';
      this._updateLightList();
      this._updatePropsPanel();
      this._updateStatus();
    } catch (err) {
      this._toast(`加载失败: ${err.message}`);
      console.error(err);
    }
  },

  // ── Light Management ──────────────────────────────────────────

  addLight(type) {
    if (!this.currentScene) return;
    const scene = this.config.scenes[this.currentScene];
    const id = `light_${Date.now().toString(36)}`;

    const defaults = {
      point: {
        id, name: '新点光源', type: 'point',
        x: 0.5, y: 0.5, depth: 0.3,
        color: [1, 1, 1], radius: 150, intensity: 0.3,
        phase: { type: 'steady', speed: 1, min: 0.2, max: 0.4 }
      },
      directional: {
        id, name: '新方向光', type: 'directional',
        dir: [1, 0.3],
        color: [1, 1, 1], intensity: 0.2,
        phase: { type: 'steady', speed: 1, min: 0.15, max: 0.25 }
      },
      global: {
        id, name: '新全局光', type: 'global',
        color: [1, 1, 1], intensity: 0.3,
        phase: { type: 'steady', speed: 1, min: 0.2, max: 0.4 }
      }
    };

    const light = defaults[type] || defaults.point;
    scene.lights.push(light);
    this.engine.addLight(light);
    this.selectedLightId = id;
    this._updateLightList();
    this._updatePropsPanel();
    this._toast(`已添加: ${light.name}`);
  },

  removeLight(id) {
    if (!this.currentScene) return;
    const scene = this.config.scenes[this.currentScene];
    scene.lights = scene.lights.filter(l => l.id !== id);
    this.engine.removeLight(id);
    if (this.selectedLightId === id) this.selectedLightId = null;
    this._updateLightList();
    this._updatePropsPanel();
  },

  selectLight(id) {
    this.selectedLightId = id;
    this._updateLightList();
    this._updatePropsPanel();
  },

  // ── Property Sync ─────────────────────────────────────────────

  _onPropChange() {
    if (!this.selectedLightId || !this.currentScene) return;
    const scene = this.config.scenes[this.currentScene];
    const light = scene.lights.find(l => l.id === this.selectedLightId);
    if (!light) return;

    light.name = document.getElementById('p-name').value;
    light.type = document.getElementById('p-type').value;
    light.x = parseFloat(document.getElementById('p-x').value) || 0;
    light.y = parseFloat(document.getElementById('p-y').value) || 0;
    light.depth = parseFloat(document.getElementById('p-depth').value) || 0.3;
    light.dir = [
      parseFloat(document.getElementById('p-dx').value) || 0,
      parseFloat(document.getElementById('p-dy').value) || 0
    ];

    // Color: hex → [r, g, b]
    const hex = document.getElementById('p-color').value;
    light.color = [
      parseInt(hex.slice(1, 3), 16) / 255,
      parseInt(hex.slice(3, 5), 16) / 255,
      parseInt(hex.slice(5, 7), 16) / 255
    ];
    document.getElementById('p-color-hex').textContent = hex;

    light.intensity = parseFloat(document.getElementById('p-intensity').value) || 0;
    light.radius = parseFloat(document.getElementById('p-radius').value) || 150;

    light.phase = {
      type: document.getElementById('p-phase-type').value,
      speed: parseFloat(document.getElementById('p-phase-speed').value) || 1,
      min: parseFloat(document.getElementById('p-phase-min').value) || 0,
      max: parseFloat(document.getElementById('p-phase-max').value) || 1,
      offset: parseFloat(document.getElementById('p-phase-offset').value) || 0
    };

    // Sync to engine
    this.engine.updateLight(this.selectedLightId, light);
    this._updateLightList(); // refresh name/color in list
    this._updateVisibility();
  },

  _updatePropsPanel() {
    const panel = document.getElementById('props-panel');
    const empty = document.getElementById('props-empty');

    if (!this.selectedLightId) {
      panel.classList.remove('visible');
      empty.style.display = 'block';
      return;
    }

    const scene = this.config.scenes[this.currentScene];
    const light = scene.lights.find(l => l.id === this.selectedLightId);
    if (!light) {
      panel.classList.remove('visible');
      empty.style.display = 'block';
      return;
    }

    panel.classList.add('visible');
    empty.style.display = 'none';

    document.getElementById('p-name').value = light.name || '';
    document.getElementById('p-type').value = light.type || 'point';
    document.getElementById('p-x').value = light.x ?? 0.5;
    document.getElementById('p-y').value = light.y ?? 0.5;
    document.getElementById('p-depth').value = light.depth ?? 0.3;

    const dir = light.dir || [0, 0];
    document.getElementById('p-dx').value = dir[0];
    document.getElementById('p-dy').value = dir[1];

    const c = light.color || [1, 1, 1];
    const hex = '#' + c.map(v =>
      Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')
    ).join('');
    document.getElementById('p-color').value = hex;
    document.getElementById('p-color-hex').textContent = hex;

    document.getElementById('p-intensity').value = light.intensity ?? 0.3;
    document.getElementById('p-radius').value = light.radius ?? 150;

    const phase = light.phase || {};
    document.getElementById('p-phase-type').value = phase.type || 'steady';
    document.getElementById('p-phase-speed').value = phase.speed ?? 1;
    document.getElementById('p-phase-min').value = phase.min ?? 0;
    document.getElementById('p-phase-max').value = phase.max ?? 1;
    document.getElementById('p-phase-offset').value = phase.offset ?? 0;

    this._updateVisibility();
  },

  _updateVisibility() {
    const type = document.getElementById('p-type').value;
    document.getElementById('g-position').style.display = type === 'point' ? 'block' : 'none';
    document.getElementById('g-direction').style.display = type === 'directional' ? 'block' : 'none';
    document.getElementById('p-radius').closest('.prop-group').querySelector('.prop-row:last-child')
      .style.display = type === 'global' ? 'none' : 'flex';
  },

  // ── Light List UI ─────────────────────────────────────────────

  _updateLightList() {
    const container = document.getElementById('light-list');
    container.innerHTML = '';

    if (!this.currentScene) return;
    const scene = this.config.scenes[this.currentScene];
    document.getElementById('light-count').textContent = scene.lights.length;

    for (const light of scene.lights) {
      const div = document.createElement('div');
      div.className = 'light-item' + (light.id === this.selectedLightId ? ' selected' : '');
      div.addEventListener('click', () => this.selectLight(light.id));

      const c = light.color || [1, 1, 1];
      const hex = '#' + c.map(v =>
        Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')
      ).join('');

      div.innerHTML = `
        <div class="light-swatch" style="background:${hex}"></div>
        <span class="light-name">${light.name || light.id}</span>
        <span class="light-type-badge">${light.type}</span>
        <span class="light-remove" title="删除" data-id="${light.id}">✕</span>
      `;

      div.querySelector('.light-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        this.removeLight(light.id);
      });

      container.appendChild(div);
    }
  },

  // ── Canvas Interaction ────────────────────────────────────────

  _onMouseMove(e) {
    const rect = e.target.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (960 / rect.width);
    const y = (e.clientY - rect.top) * (640 / rect.height);
    this.mouseUV = { x: x / 960, y: y / 640 };

    const overlay = document.getElementById('coord-overlay');
    overlay.style.display = 'block';
    overlay.textContent = `x: ${this.mouseUV.x.toFixed(3)}  y: ${this.mouseUV.y.toFixed(3)}`;

    // If dragging a selected point light, update position
    if (e.buttons === 1 && this.selectedLightId) {
      const scene = this.config.scenes[this.currentScene];
      const light = scene.lights.find(l => l.id === this.selectedLightId);
      if (light && light.type === 'point') {
        light.x = Math.max(0, Math.min(1, this.mouseUV.x));
        light.y = Math.max(0, Math.min(1, this.mouseUV.y));
        this.engine.updateLight(light.id, light);
        document.getElementById('p-x').value = light.x.toFixed(3);
        document.getElementById('p-y').value = light.y.toFixed(3);
      }
    }
  },

  _onCanvasClick(e) {
    if (!this.currentScene) return;
    const rect = e.target.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (960 / rect.width) / 960;
    const y = (e.clientY - rect.top) * (640 / rect.height) / 640;

    // Find closest point light to click
    const scene = this.config.scenes[this.currentScene];
    let closest = null;
    let closestDist = Infinity;

    for (const light of scene.lights) {
      if (light.type !== 'point') continue;
      const dx = (light.x || 0.5) - x;
      const dy = (light.y || 0.5) - y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < closestDist && dist < 0.05) {
        closestDist = dist;
        closest = light;
      }
    }

    if (closest) {
      this.selectLight(closest.id);
    }
  },

  // ── Marker Overlay ────────────────────────────────────────────

  _drawMarkers() {
    const overlay = document.getElementById('marker-overlay');
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, 960, 640);

    if (!this.currentScene) return;
    const scene = this.config.scenes[this.currentScene];

    for (const light of scene.lights) {
      if (light.type !== 'point') continue;

      const px = (light.x || 0.5) * 960;
      const py = (light.y || 0.5) * 640;
      const isSelected = light.id === this.selectedLightId;

      // Glow
      const c = light.color || [1, 1, 1];
      const hex = '#' + c.map(v =>
        Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')
      ).join('');

      ctx.beginPath();
      ctx.arc(px, py, isSelected ? 8 : 5, 0, Math.PI * 2);
      ctx.fillStyle = hex;
      ctx.globalAlpha = isSelected ? 0.9 : 0.6;
      ctx.fill();

      if (isSelected) {
        ctx.beginPath();
        ctx.arc(px, py, 14, 0, Math.PI * 2);
        ctx.strokeStyle = hex;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.4;
        ctx.stroke();
      }

      // Label
      ctx.globalAlpha = 1;
      ctx.font = '10px Courier New';
      ctx.fillStyle = isSelected ? '#00ff88' : '#666';
      ctx.fillText(light.name || light.id, px + 10, py - 8);
    }
  },

  // ── Controls ──────────────────────────────────────────────────

  togglePlay() {
    if (this.playing) {
      this.engine.stop();
      this.playing = false;
      document.getElementById('btn-play').textContent = '⏵ 播放';
    } else {
      this.engine.start();
      this.playing = true;
      document.getElementById('btn-play').textContent = '⏸ 暂停';
    }
  },

  resetTime() {
    this.engine.time = 0;
    this._toast('时间已重置');
  },

  resetScene() {
    if (!this.currentScene) return;
    if (!confirm(`确定重置 "${this.currentScene}" 的所有光源到默认值？`)) return;

    const defaults = this.defaultConfig.scenes[this.currentScene];
    if (defaults) {
      this.config.scenes[this.currentScene].lights = JSON.parse(JSON.stringify(defaults.lights));
      this.engine.setLights(this.config.scenes[this.currentScene].lights);
      this.selectedLightId = null;
      this._updateLightList();
      this._updatePropsPanel();
      this._toast('场景已重置');
    }
  },

  saveConfig() {
    const json = JSON.stringify(this.config, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lighting-config.json';
    a.click();
    URL.revokeObjectURL(url);
    this._toast('配置已保存');
  },

  exportFrame() {
    const dataURL = this.engine.captureFrame();
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = `lighting_${this.currentScene}_${Date.now()}.png`;
    a.click();
    this._toast('帧已导出');
  },

  // ── Frame Callback ────────────────────────────────────────────

  _onFrame(t) {
    document.getElementById('time-display').textContent = `t = ${t.toFixed(2)}s`;
    this._drawMarkers();
  },

  _updateStatus() {
    const scene = this.config.scenes[this.currentScene];
    const bar = document.getElementById('status-bar');
    bar.innerHTML = `<span class="ok">●</span> ${scene.name} — ${scene.lights.length} 个光源 — WebGL 实时渲染`;
  },

  _toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }
};

// Boot
window.addEventListener('DOMContentLoaded', () => Editor.init());
</script>
