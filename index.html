<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST SIGNAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Pixel';
    src: local('Courier New');
  }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    color: #c0c0c0;
  }

  #game-container {
    position: relative;
    width: 960px;
    height: 700px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #scene-canvas {
    width: 960px;
    height: 640px;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair;
  }

  /* 对话框 */
  #dialogue-box {
    position: absolute;
    bottom: 60px;
    left: 0;
    right: 0;
    background: rgba(10, 10, 20, 0.95);
    border-top: 2px solid #00ff88;
    border-bottom: 2px solid #00ff88;
    padding: 15px 20px;
    min-height: 120px;
    display: none;
    z-index: 10;
  }

  #dialogue-inner {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  #dialogue-portrait {
    width: 80px;
    height: 80px;
    border: 2px solid #00ff88;
    image-rendering: pixelated;
    flex-shrink: 0;
    display: none;
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
  }

  #dialogue-portrait.visible {
    display: block;
  }

  #dialogue-body {
    flex: 1;
    min-width: 0;
  }

  #dialogue-speaker {
    color: #00ff88;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  #dialogue-text {
    color: #e0e0e0;
    font-size: 15px;
    line-height: 1.6;
  }

  /* 关键词微震效果 */
  @keyframes kw-buzz {
    0%, 100% { transform: translate(0, 0); }
    20%      { transform: translate(-0.5px, 0.3px); }
    40%      { transform: translate(0.5px, -0.3px); }
    60%      { transform: translate(-0.3px, -0.5px); }
    80%      { transform: translate(0.3px, 0.5px); }
  }

  .kw-buzz {
    display: inline-block;
    animation: kw-buzz 0.35s ease-in-out 2;
    color: #00ff88;
    text-shadow: 0 0 6px rgba(0, 255, 136, 0.35);
    font-weight: bold;
  }

  #dialogue-choices {
    margin-top: 10px;
  }

  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(0, 255, 136, 0.08);
    border: 1px solid #00ff8844;
    color: #00ff88;
    padding: 8px 15px;
    margin: 4px 0;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.15s;
  }

  .choice-btn:hover {
    background: rgba(0, 255, 136, 0.2);
    border-color: #00ff88;
    padding-left: 20px;
  }

  /* 底部 HUD */
  #hud {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #0a0a14;
    border-top: 1px solid #222;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 10px;
    z-index: 5;
  }

  #inventory-bar {
    display: flex;
    gap: 5px;
    flex: 1;
  }

  .inv-slot {
    width: 44px;
    height: 44px;
    border: 1px solid #333;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .inv-slot.has-item {
    border-color: #00ff88;
    background: rgba(0, 255, 136, 0.05);
  }

  .inv-slot.has-item:hover {
    background: rgba(0, 255, 136, 0.15);
    transform: scale(1.1);
  }

  .inv-slot.selected {
    border-color: #ff6600;
    box-shadow: 0 0 8px #ff660066;
  }

  .inv-tooltip {
    display: none;
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    border: 1px solid #00ff88;
    padding: 5px 10px;
    font-size: 11px;
    white-space: nowrap;
    z-index: 20;
    color: #00ff88;
  }

  .inv-slot:hover .inv-tooltip {
    display: block;
  }

  #scene-name {
    color: #555;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    min-width: 200px;
    text-align: right;
  }

  /* 提示文字 */
  #hint-text {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ff88;
    font-size: 13px;
    background: rgba(0,0,0,0.8);
    padding: 5px 15px;
    border: 1px solid #00ff8844;
    z-index: 15;
    display: none;
    text-align: center;
    pointer-events: none;
  }

  /* 标题画面 */
  #title-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #title-screen h1 {
    color: #00ff88;
    font-size: 48px;
    letter-spacing: 12px;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 0 20px #00ff8844;
  }

  #title-screen .subtitle {
    color: #555;
    font-size: 13px;
    letter-spacing: 4px;
    margin-bottom: 60px;
  }

  #title-screen .start-btn {
    color: #00ff88;
    font-size: 16px;
    cursor: pointer;
    letter-spacing: 3px;
    animation: blink 1.5s infinite;
    border: 1px solid #00ff8844;
    padding: 12px 40px;
    background: none;
    font-family: inherit;
  }

  #title-screen .start-btn:hover {
    background: rgba(0, 255, 136, 0.1);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .credits {
    position: absolute;
    bottom: 20px;
    color: #333;
    font-size: 11px;
    letter-spacing: 2px;
  }

  /* 过场 */
  #fade-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s;
  }

  #fade-overlay.active {
    opacity: 1;
  }

  /* 场景滤镜 */
  #scene-canvas.filter-underground {
    filter: brightness(0.55) contrast(1.3) saturate(0.3) sepia(0.4) hue-rotate(-10deg);
  }
  #scene-canvas.filter-core {
    filter: brightness(0.5) contrast(1.4) saturate(0.2) hue-rotate(200deg);
  }

  /* 结局画面 */
  #ending-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    padding: 40px;
  }

  #ending-screen h2 {
    color: #00ff88;
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 30px;
  }

  #ending-screen p {
    color: #aaa;
    font-size: 14px;
    line-height: 2;
    max-width: 600px;
    margin-bottom: 20px;
  }

  #ending-screen .restart-btn {
    color: #555;
    font-size: 13px;
    cursor: pointer;
    margin-top: 30px;
    letter-spacing: 2px;
    background: none;
    border: 1px solid #333;
    padding: 10px 30px;
    font-family: inherit;
  }

  #ending-screen .restart-btn:hover {
    border-color: #00ff88;
    color: #00ff88;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene-canvas" width="960" height="640"></canvas>

  <div id="dialogue-box">
    <div id="dialogue-inner">
      <img id="dialogue-portrait" />
      <div id="dialogue-body">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-choices"></div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="inventory-bar"></div>
    <div id="scene-name"></div>
  </div>

  <div id="hint-text"></div>
  <div id="fade-overlay"></div>

  <div id="title-screen">
    <h1>LAST SIGNAL</h1>
    <div class="subtitle">最 后 的 信 号</div>
    <button class="start-btn" onclick="Game.start()">▶ 开 始 游 戏</button>
    <div class="credits">A POINT & CLICK ADVENTURE</div>
  </div>

  <div id="ending-screen">
    <h2 id="ending-title"></h2>
    <div id="ending-text"></div>
    <button class="restart-btn" onclick="location.reload()">↺ 重新开始</button>
  </div>
</div>

<script>
// ============================================================
// PARTICLE / VFX ENGINE — 实时环境动效系统
// ============================================================
const VFX = {
  // 全局状态
  raindrops: [],        // 雨滴粒子
  fogLayers: [],
  neonPulse: 0,         // 霓虹脉冲相位
  lightFlicker: 1.0,    // 全局亮度闪烁因子
  scanlineOffset: 0,    // CRT 扫描线偏移
  glitchTimer: 0,       // 故障效果计时器
  glitchActive: false,   // 是否正在故障

  // 场景 VFX 配置 — 每个场景定义自己的动效组合
  SCENE_CONFIG: {
    apartment: {
      rain: { count: 60, speed: [3, 6], length: [8, 16], opacity: 0.15, wind: 0.3, clipToMask: 'apartment_window' },
      fog: { layers: 1, speed: 0.15, opacity: 0.06, color: [80, 80, 120] },
      neon: { speed: 0.008, intensity: 0.12 },
      flicker: { enabled: true, chance: 0.003, amount: 0.08 },
      scanlines: { enabled: true, opacity: 0.03 },
      vignette: { inner: 220, outer: 560, opacity: 0.55 },
      particles: { type: 'dust', count: 15, speed: 0.2, opacity: 0.08 },
    },
    street: {
      rain: { count: 200, speed: [5, 10], length: [12, 28], opacity: 0.22, wind: 0.5 },
      fog: { layers: 2, speed: 0.25, opacity: 0.10, color: [60, 70, 110] },
      neon: { speed: 0.012, intensity: 0.18 },
      flicker: { enabled: true, chance: 0.008, amount: 0.12 },
      scanlines: { enabled: false },
      vignette: { inner: 200, outer: 580, opacity: 0.5 },
      puddleReflection: { enabled: true, y: 500, opacity: 0.15 },
      particles: { type: 'steam', count: 8, speed: 0.4, opacity: 0.06 },
    },
    bar: {
      rain: { count: 0 },
      fog: { layers: 1, speed: 0.08, opacity: 0.08, color: [90, 40, 80] },
      neon: { speed: 0.015, intensity: 0.22 },
      flicker: { enabled: true, chance: 0.01, amount: 0.15 },
      scanlines: { enabled: true, opacity: 0.02 },
      vignette: { inner: 180, outer: 500, opacity: 0.6 },
      particles: { type: 'smoke', count: 12, speed: 0.15, opacity: 0.10 },
    },
    alley: {
      rain: { count: 120, speed: [4, 8], length: [10, 22], opacity: 0.20, wind: 0.6 },
      fog: { layers: 1, speed: 0.10, opacity: 0.12, color: [50, 50, 70] },
      neon: { speed: 0.020, intensity: 0.15 },
      flicker: { enabled: true, chance: 0.015, amount: 0.20 },
      scanlines: { enabled: false },
      vignette: { inner: 150, outer: 480, opacity: 0.65 },
      particles: { type: 'drip', count: 5, speed: 1.5, opacity: 0.12 },
    },
    tower: {
      rain: { count: 160, speed: [5, 9], length: [14, 26], opacity: 0.20, wind: 0.4 },
      fog: { layers: 2, speed: 0.20, opacity: 0.08, color: [50, 60, 100] },
      neon: { speed: 0.006, intensity: 0.08 },
      flicker: { enabled: true, chance: 0.005, amount: 0.10 },
      scanlines: { enabled: false },
      vignette: { inner: 250, outer: 600, opacity: 0.45 },
      particles: { type: 'dust', count: 10, speed: 0.3, opacity: 0.05 },
    },
    server: {
      rain: { count: 0 },
      fog: { layers: 0 },
      neon: { speed: 0.005, intensity: 0.06 },
      flicker: { enabled: true, chance: 0.02, amount: 0.18 },
      scanlines: { enabled: true, opacity: 0.04 },
      vignette: { inner: 200, outer: 520, opacity: 0.5 },
      particles: { type: 'data', count: 20, speed: 0.5, opacity: 0.10 },
    },
    rooftop: {
      rain: { count: 250, speed: [6, 12], length: [15, 32], opacity: 0.25, wind: 0.7 },
      fog: { layers: 3, speed: 0.35, opacity: 0.14, color: [70, 80, 120] },
      neon: { speed: 0.010, intensity: 0.10 },
      flicker: { enabled: false },
      scanlines: { enabled: false },
      vignette: { inner: 280, outer: 600, opacity: 0.4 },
      particles: { type: 'wind', count: 10, speed: 1.0, opacity: 0.04 },
    },
    office: {
      rain: { count: 40, speed: [3, 5], length: [8, 14], opacity: 0.12, wind: 0.2 },
      fog: { layers: 1, speed: 0.10, opacity: 0.05, color: [100, 100, 130] },
      neon: { speed: 0.006, intensity: 0.10 },
      flicker: { enabled: true, chance: 0.004, amount: 0.06 },
      scanlines: { enabled: true, opacity: 0.02 },
      vignette: { inner: 200, outer: 540, opacity: 0.5 },
      particles: { type: 'dust', count: 12, speed: 0.15, opacity: 0.06 },
    },
    underground: {
      rain: { count: 0 },
      fog: { layers: 1, speed: 0.06, opacity: 0.10, color: [80, 30, 30] },
      neon: { speed: 0.018, intensity: 0.20 },
      flicker: { enabled: true, chance: 0.025, amount: 0.22 },
      scanlines: { enabled: true, opacity: 0.05 },
      vignette: { inner: 170, outer: 480, opacity: 0.65 },
      particles: { type: 'data', count: 30, speed: 0.6, opacity: 0.12 },
    },
    core: {
      rain: { count: 0 },
      fog: { layers: 0 },
      neon: { speed: 0.025, intensity: 0.30 },
      flicker: { enabled: true, chance: 0.035, amount: 0.25 },
      scanlines: { enabled: true, opacity: 0.06 },
      vignette: { inner: 140, outer: 450, opacity: 0.7 },
      particles: { type: 'data', count: 50, speed: 0.8, opacity: 0.15 },
    },
  },

  // 通用粒子池
  particles: [],

  // ---- 初始化场景 VFX ----
  init(sceneId) {
    const cfg = this.SCENE_CONFIG[sceneId] || this.SCENE_CONFIG.apartment;
    this.raindrops = [];
    this.fogLayers = [];
    this.particles = [];

    // 初始化雨滴
    if (cfg.rain && cfg.rain.count > 0) {
      for (let i = 0; i < cfg.rain.count; i++) {
        this.raindrops.push(this._newRaindrop(cfg.rain));
      }
    }

    // 初始化雾气层
    if (cfg.fog && cfg.fog.layers > 0) {
      for (let i = 0; i < cfg.fog.layers; i++) {
        this.fogLayers.push({
          x: Math.random() * 960,
          y: 100 + Math.random() * 300,
          w: 300 + Math.random() * 500,
          h: 80 + Math.random() * 120,
          speed: cfg.fog.speed * (0.5 + Math.random()),
          opacity: cfg.fog.opacity * (0.5 + Math.random() * 0.5),
          color: cfg.fog.color,
        });
      }
    }

    // 初始化环境粒子
    if (cfg.particles && cfg.particles.count > 0) {
      for (let i = 0; i < cfg.particles.count; i++) {
        this.particles.push(this._newParticle(cfg.particles));
      }
    }

    this.neonPulse = Math.random() * Math.PI * 2;
    this.lightFlicker = 1.0;
    this.glitchActive = false;
    this.glitchTimer = 0;
  },

  _newRaindrop(rcfg) {
    return {
      x: Math.random() * 1000 - 20,
      y: Math.random() * 680 - 40,
      speed: rcfg.speed[0] + Math.random() * (rcfg.speed[1] - rcfg.speed[0]),
      length: rcfg.length[0] + Math.random() * (rcfg.length[1] - rcfg.length[0]),
      opacity: 0.3 + Math.random() * 0.7,
      wind: rcfg.wind || 0,
    };
  },

  _newParticle(pcfg) {
    const p = {
      x: Math.random() * 960,
      y: Math.random() * 640,
      vx: (Math.random() - 0.5) * pcfg.speed,
      vy: -Math.random() * pcfg.speed * 0.5,
      life: Math.random(),
      maxLife: 2 + Math.random() * 4,
      age: 0,
      size: 1 + Math.random() * 3,
      opacity: pcfg.opacity * (0.3 + Math.random() * 0.7),
      type: pcfg.type,
    };
    // 根据类型微调
    if (pcfg.type === 'steam') {
      p.vy = -0.3 - Math.random() * 0.5;
      p.vx = (Math.random() - 0.5) * 0.8;
      p.size = 3 + Math.random() * 6;
      p.y = 500 + Math.random() * 140;
    } else if (pcfg.type === 'smoke') {
      p.vy = -0.1 - Math.random() * 0.2;
      p.vx = 0.1 + Math.random() * 0.3;
      p.size = 8 + Math.random() * 15;
    } else if (pcfg.type === 'drip') {
      p.vy = 1.0 + Math.random() * 2.0;
      p.vx = 0;
      p.y = Math.random() * 200;
    } else if (pcfg.type === 'data') {
      p.vy = 0.5 + Math.random() * 1.5;
      p.vx = 0;
      p.x = Math.random() * 960;
      p.y = -10;
      p.size = 1;
    } else if (pcfg.type === 'wind') {
      p.vx = 1.5 + Math.random() * 2.0;
      p.vy = -0.2 + Math.random() * 0.4;
      p.y = Math.random() * 640;
      p.x = -20;
      p.size = 1 + Math.random() * 2;
    }
    return p;
  },

  // ---- 主渲染入口 ----
  render(ctx, dt, sceneId) {
    const cfg = this.SCENE_CONFIG[sceneId];
    if (!cfg) return;

    // 1. 雨滴
    if (cfg.rain && cfg.rain.count > 0) {
      this._renderRain(ctx, dt, cfg.rain);
    }

    // 2. 雾气
    if (cfg.fog && cfg.fog.layers > 0) {
      this._renderFog(ctx, dt, cfg.fog);
    }

    // 3. 霓虹脉冲 (叠加在背景上的色相微偏移)
    if (cfg.neon) {
      this._renderNeonPulse(ctx, dt, cfg.neon);
    }

    // 4. 环境粒子
    if (cfg.particles && cfg.particles.count > 0) {
      this._renderParticles(ctx, dt, cfg.particles);
    }

    // 5. 水洼反射
    if (cfg.puddleReflection && cfg.puddleReflection.enabled) {
      this._renderPuddleReflection(ctx, dt, cfg.puddleReflection);
    }

    // 6. 暗角
    if (cfg.vignette) {
      this._renderVignette(ctx, cfg.vignette);
    }

    // 7. 全局亮度闪烁
    if (cfg.flicker && cfg.flicker.enabled) {
      this._applyFlicker(ctx, dt, cfg.flicker);
    }

    // 8. CRT 扫描线
    if (cfg.scanlines && cfg.scanlines.enabled) {
      this._renderScanlines(ctx, cfg.scanlines);
    }

    // 9. 偶发故障效果
    this._maybeGlitch(ctx, dt);
  },

  // ---- 雨滴渲染 ----
  _renderRain(ctx, dt, rcfg) {
    // 更新雨滴位置
    for (const drop of this.raindrops) {
      drop.y += drop.speed;
      drop.x += drop.wind;
      if (drop.y > 660) { drop.y = -drop.length - Math.random() * 40; drop.x = Math.random() * 1000 - 20; }
      if (drop.x > 980) drop.x = -20;
    }

    ctx.save();

    if (rcfg.clipToMask && Game.objMasks && Game.objMasks[rcfg.clipToMask]) {
      // 室内：雨滴只在窗口 mask 区域显示
      if (!this._rainCanvas) {
        this._rainCanvas = document.createElement('canvas');
        this._rainCanvas.width = 960;
        this._rainCanvas.height = 640;
      }
      const rc = this._rainCanvas.getContext('2d');
      rc.clearRect(0, 0, 960, 640);

      // 在临时 canvas 上画雨丝
      rc.strokeStyle = 'rgba(180, 200, 255, ' + rcfg.opacity + ')';
      rc.lineWidth = 1;
      rc.beginPath();
      for (const drop of this.raindrops) {
        rc.moveTo(drop.x, drop.y);
        rc.lineTo(drop.x + drop.wind * drop.length, drop.y + drop.length);
      }
      rc.stroke();

      // destination-in：只保留 mask 区域内的像素
      rc.globalCompositeOperation = 'destination-in';
      rc.drawImage(Game.objMasks[rcfg.clipToMask].canvas, 0, 0, 960, 640);

      // 画到主 canvas（正常叠加，不破坏背景）
      ctx.drawImage(this._rainCanvas, 0, 0);
    } else {
      // 室外：全屏雨滴
      ctx.strokeStyle = 'rgba(180, 200, 255, ' + rcfg.opacity + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const drop of this.raindrops) {
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x + drop.wind * drop.length, drop.y + drop.length);
      }
      ctx.stroke();
    }

    ctx.restore();
  },

  _rainCanvas: null,

  // ---- 雾气渲染 ----
  _renderFog(ctx, dt, fcfg) {
    ctx.save();
    for (const fog of this.fogLayers) {
      fog.x += fog.speed;
      if (fog.x > 960 + fog.w) fog.x = -fog.w;

      const grad = ctx.createRadialGradient(
        fog.x + fog.w / 2, fog.y + fog.h / 2, 0,
        fog.x + fog.w / 2, fog.y + fog.h / 2, fog.w / 2
      );
      const [r, g, b] = fog.color;
      grad.addColorStop(0, `rgba(${r},${g},${b},${fog.opacity})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

      ctx.fillStyle = grad;
      ctx.fillRect(fog.x, fog.y, fog.w, fog.h);
    }
    ctx.restore();
  },

  // ---- 霓虹脉冲 ----
  _renderNeonPulse(ctx, dt, ncfg) {
    this.neonPulse += ncfg.speed;
    const pulse = Math.sin(this.neonPulse) * 0.5 + 0.5;
    const alpha = ncfg.intensity * pulse;

    // 在背景上叠加一层极淡的绿色/紫色色偏
    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // 绿色霓虹光晕（散布在画面上半部）
    const grad1 = ctx.createRadialGradient(300, 200, 0, 300, 200, 250);
    grad1.addColorStop(0, `rgba(0, 255, 136, ${alpha * 0.4})`);
    grad1.addColorStop(1, 'rgba(0, 255, 136, 0)');
    ctx.fillStyle = grad1;
    ctx.fillRect(0, 0, 960, 640);

    // 紫色霓虹光晕
    const grad2 = ctx.createRadialGradient(700, 150, 0, 700, 150, 200);
    grad2.addColorStop(0, `rgba(180, 0, 255, ${alpha * 0.3})`);
    grad2.addColorStop(1, 'rgba(180, 0, 255, 0)');
    ctx.fillStyle = grad2;
    ctx.fillRect(0, 0, 960, 640);

    ctx.restore();
  },

  // ---- 环境粒子 ----
  _renderParticles(ctx, dt, pcfg) {
    ctx.save();
    for (const p of this.particles) {
      p.age += dt / 1000;
      p.x += p.vx;
      p.y += p.vy;

      // 生命周期
      let alpha;
      if (p.age < p.maxLife * 0.2) {
        alpha = p.opacity * (p.age / (p.maxLife * 0.2));
      } else if (p.age > p.maxLife * 0.7) {
        alpha = p.opacity * (1 - (p.age - p.maxLife * 0.7) / (p.maxLife * 0.3));
      } else {
        alpha = p.opacity;
      }

      if (p.age >= p.maxLife || p.y < -20 || p.y > 660 || p.x < -20 || p.x > 980) {
        Object.assign(p, this._newParticle(pcfg));
        p.age = 0;
        continue;
      }

      ctx.globalAlpha = alpha;
      if (p.type === 'data') {
        // 数据流粒子：绿色小方块
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(p.x, p.y, 2, 2);
      } else if (p.type === 'steam') {
        // 蒸汽：灰色半透明圆
        ctx.fillStyle = 'rgba(160, 170, 190, 0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'smoke') {
        // 烟雾：紫灰色大圆
        ctx.fillStyle = 'rgba(120, 80, 140, 0.3)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'drip') {
        // 水滴：蓝色小点
        ctx.fillStyle = 'rgba(140, 180, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'wind') {
        // 风尘：灰白色线条
        ctx.strokeStyle = 'rgba(200, 200, 220, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 8, p.y - p.vy * 4);
        ctx.stroke();
      } else {
        // 灰尘：黄色小点
        ctx.fillStyle = 'rgba(200, 180, 120, 0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  // ---- 水洼反射 ----
  _renderPuddleReflection(ctx, dt, pcfg) {
    ctx.save();
    // 在画面底部添加水面反射效果
    const grad = ctx.createLinearGradient(0, pcfg.y, 0, 640);
    grad.addColorStop(0, 'rgba(0, 200, 255, 0)');
    grad.addColorStop(0.3, `rgba(0, 180, 255, ${pcfg.opacity * 0.3})`);
    grad.addColorStop(1, `rgba(0, 150, 200, ${pcfg.opacity * 0.1})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, pcfg.y, 960, 640 - pcfg.y);

    // 水面波纹
    ctx.strokeStyle = `rgba(100, 200, 255, ${pcfg.opacity * 0.15})`;
    ctx.lineWidth = 0.5;
    const time = performance.now() * 0.001;
    for (let i = 0; i < 6; i++) {
      const y = pcfg.y + 20 + i * 22;
      const amp = 2 + Math.sin(time + i) * 1.5;
      ctx.beginPath();
      for (let x = 0; x < 960; x += 4) {
        const dy = Math.sin(x * 0.02 + time * 1.5 + i * 0.7) * amp;
        if (x === 0) ctx.moveTo(x, y + dy);
        else ctx.lineTo(x, y + dy);
      }
      ctx.stroke();
    }
    ctx.restore();
  },

  // ---- 暗角 ----
  _renderVignette(ctx, vcfg) {
    const grad = ctx.createRadialGradient(480, 320, vcfg.inner, 480, 320, vcfg.outer);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${vcfg.opacity})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 960, 640);
  },

  // ---- 全局闪烁 ----
  _applyFlicker(ctx, dt, fcfg) {
    if (Math.random() < fcfg.chance) {
      this.lightFlicker = 1.0 - fcfg.amount * Math.random();
    } else {
      // 平滑恢复
      this.lightFlicker += (1.0 - this.lightFlicker) * 0.1;
    }

    if (this.lightFlicker < 0.98) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = `rgb(${Math.floor(this.lightFlicker * 255)},${Math.floor(this.lightFlicker * 255)},${Math.floor(this.lightFlicker * 255)})`;
      ctx.fillRect(0, 0, 960, 640);
      ctx.restore();
    }
  },

  // ---- CRT 扫描线 ----
  _renderScanlines(ctx, scfg) {
    this.scanlineOffset = (this.scanlineOffset + 0.5) % 4;
    ctx.save();
    ctx.fillStyle = `rgba(0,0,0,${scfg.opacity})`;
    for (let y = this.scanlineOffset; y < 640; y += 4) {
      ctx.fillRect(0, y, 960, 1);
    }
    ctx.restore();
  },

  // ---- 偶发故障效果 ----
  _maybeGlitch(ctx, dt) {
    this.glitchTimer += dt;
    if (!this.glitchActive && this.glitchTimer > 8000 + Math.random() * 15000) {
      this.glitchActive = true;
      this.glitchTimer = 0;
      setTimeout(() => { this.glitchActive = false; }, 80 + Math.random() * 120);
    }

    if (this.glitchActive) {
      ctx.save();
      // 随机水平位移几行
      const sliceY = Math.floor(Math.random() * 600);
      const sliceH = 2 + Math.floor(Math.random() * 8);
      const shift = (Math.random() - 0.5) * 20;
      const imgData = ctx.getImageData(0, sliceY, 960, sliceH);
      ctx.putImageData(imgData, shift, sliceY);

      // 红/蓝色偏
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = `rgba(255, 0, 0, ${0.05 + Math.random() * 0.05})`;
      ctx.fillRect(0, 0, 960, 640);
      ctx.restore();
    }
  },
};


// ============================================================
// LAST SIGNAL - Point & Click Adventure Engine
// ============================================================
const Game = {
  canvas: null,
  ctx: null,
  currentScene: null,
  inventory: [],
  flags: {},
  images: {},
  bgFrames: {},
  currentFrame: 0,
  frameTimer: 0,
  frameInterval: 83,
  masks: {},
  objMasks: {},
  selectedItem: null,
  dialogueActive: false,
  mouseX: 0,
  mouseY: 0,
  audioCtx: null,

  async init() {
    this.canvas = document.getElementById('scene-canvas');
    this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    this.ctx.imageSmoothingEnabled = false;

    this.canvas.addEventListener('click', (e) => this.handleClick(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMove(e));

    await this.loadImages();
    await this.loadMasks();
    this.buildInventoryUI();
  },

  async loadImages() {
    const sceneBgs = [
      'bg_apartment', 'bg_street', 'bg_bar', 'bg_alley',
      'bg_tower_exterior', 'bg_server_room', 'bg_rooftop', 'bg_office'
    ];
    const portraits = ['portrait_kai', 'portrait_oracle'];
    const NUM_FRAMES = 24; // Depth Lighting 生成 24 帧/场景

    const loadImg = (src) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    };

    const promises = [];

    for (const bgName of sceneBgs) {
      // 尝试加载全部 12 帧 (Depth Lighting 生成)
      const framePromises = [];
      for (let fi = 0; fi < NUM_FRAMES; fi++) {
        framePromises.push(loadImg(`assets/${bgName}_f${fi}.png`));
      }
      promises.push(
        Promise.all(framePromises).then(frames => {
          // 过滤掉加载失败的帧
          const validFrames = frames.filter(f => f !== null);
          if (validFrames.length > 0) {
            this.bgFrames[bgName] = validFrames;
            this.images[bgName] = validFrames[0];
          } else {
            // 降级：尝试加载旧格式
            return loadImg(`assets/${bgName}.png`).then(img => {
              this.images[bgName] = img;
              this.bgFrames[bgName] = img ? [img] : [];
            });
          }
        })
      );
    }

    for (const name of portraits) {
      promises.push(loadImg(`assets/${name}.png`).then(img => { this.images[name] = img; }));
    }

    await Promise.all(promises);

    // 汇报加载结果
    for (const bgName of sceneBgs) {
      const count = (this.bgFrames[bgName] || []).length;
      if (count > 1) {
        console.log(`🎬 ${bgName}: ${count} 帧 (AI 动画模式)`);
      } else {
        console.log(`🖼️ ${bgName}: 1 帧 (静态 + VFX 模式)`);
      }
    }
  },

  async loadMasks() {
    const sceneIds = ['apartment', 'street', 'bar', 'alley', 'tower', 'server', 'rooftop', 'office', 'underground', 'core'];

    const loadMask = (url) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = 960; c.height = 640;
          const cx = c.getContext('2d', { willReadFrequently: true });
          cx.drawImage(img, 0, 0, 960, 640);
          const data = cx.getImageData(0, 0, 960, 640);
          resolve({ canvas: c, ctx: cx, data });
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    };

    const comboPromises = sceneIds.map(id =>
      loadMask(`assets/masks/${id}_mask.png`).then(m => { this.masks[id] = m; })
    );

    const objMaskList = [];
    for (const [sceneId, scene] of Object.entries(SCENES)) {
      if (!scene.hotspots) continue;
      for (const hs of scene.hotspots) {
        if (hs.maskId) objMaskList.push({ sceneId, objId: hs.maskId });
      }
    }
    const objPromises = objMaskList.map(({ sceneId, objId }) =>
      loadMask(`assets/masks/${sceneId}_${objId}_mask.png`).then(m => {
        if (m) this.objMasks[`${sceneId}_${objId}`] = m;
      })
    );

    await Promise.all([...comboPromises, ...objPromises]);

    // 预计算边缘像素、标签位置、遮罩层
    for (const id of sceneIds) {
      const mask = this.masks[id];
      if (!mask) continue;
      const d = mask.data.data;
      const edges = [];
      for (let y = 1; y < 639; y += 3) {
        for (let x = 1; x < 959; x += 3) {
          if (d[(y * 960 + x) * 4] > 128) {
            if (d[((y) * 960 + x - 3) * 4] <= 128 ||
                d[((y) * 960 + x + 3) * 4] <= 128 ||
                d[((y - 3) * 960 + x) * 4] <= 128 ||
                d[((y + 3) * 960 + x) * 4] <= 128) {
              edges.push(x, y);
            }
          }
        }
      }
      this._edgeCache[id] = edges;

      let sx = 0, sy = 0, cnt = 0;
      for (let y = 0; y < 640; y += 8) {
        for (let x = 0; x < 960; x += 8) {
          if (d[(y * 960 + x) * 4] > 128) { sx += x; sy += y; cnt++; }
        }
      }
      if (cnt > 0) this._labelCache[id] = { x: sx / cnt, y: sy / cnt };

      const oc = document.createElement('canvas');
      oc.width = 960; oc.height = 640;
      const ox = oc.getContext('2d');
      ox.fillStyle = 'rgba(0,255,136,0.12)';
      for (let y = 0; y < 640; y += 3) {
        for (let x = 0; x < 960; x += 3) {
          if (d[(y * 960 + x) * 4] > 128) ox.fillRect(x, y, 3, 3);
        }
      }
      this._overlayCache[id] = oc;
    }
  },

  _edgeCache: {},
  _labelCache: {},
  _overlayCache: {},

  isMaskHit(x, y) {
    const mask = this.masks[this.currentScene];
    if (!mask) return false;
    const px = Math.floor(x), py = Math.floor(y);
    if (px < 0 || px >= 960 || py < 0 || py >= 640) return false;
    return mask.data.data[(py * 960 + px) * 4] > 128;
  },

  start() {
    document.getElementById('title-screen').style.display = 'none';
    this.initAudio();
    this.goScene('apartment');
  },

  renderLoop: null,

  async goScene(sceneId) {
    const fade = document.getElementById('fade-overlay');
    fade.classList.add('active');

    await this.sleep(600);
    this.currentScene = sceneId;
    this.selectedItem = null;
    this.hideDialogue();

    // 场景滤镜
    const FILTER_MAP = { underground: 'filter-underground', core: 'filter-core' };
    this.canvas.className = FILTER_MAP[sceneId] || '';

    // 初始化 VFX 引擎
    VFX.init(sceneId);

    this.startRenderLoop();
    this.updateHUD();

    const scene = SCENES[sceneId];
    if (scene && scene.onEnter) {
      await this.sleep(300);
      scene.onEnter();
    }

    fade.classList.remove('active');
  },

  startRenderLoop() {
    if (this.renderLoop) cancelAnimationFrame(this.renderLoop);
    this.lastFrameTime = performance.now();
    this.frameTimer = 0;
    this.currentFrame = 0;
    const loop = (now) => {
      const dt = now - this.lastFrameTime;
      this.lastFrameTime = now;

      // AI 帧序列慢速播放 (~800ms/帧)
      this.frameTimer += dt;
      if (this.frameTimer >= this.frameInterval) {
        this.frameTimer = 0;
        const frames = this.bgFrames[this.currentScene];
        if (frames && frames.length > 1) {
          this.currentFrame = (this.currentFrame + 1) % frames.length;
        }
      }

      this.render(dt);
      this.renderLoop = requestAnimationFrame(loop);
    };
    this.renderLoop = requestAnimationFrame(loop);
  },

  hotspotAnim: 0,

  render(dt) {
    const scene = SCENES[this.currentScene];
    if (!scene) return;

    const bgName = scene.background;
    const frames = this.bgFrames[bgName];
    let img;
    if (frames && frames.length > 0) img = frames[this.currentFrame % frames.length];
    if (!img) img = this.images[bgName];

    if (img) {
      this.ctx.drawImage(img, 0, 0, 960, 640);
    } else {
      this.ctx.fillStyle = '#111';
      this.ctx.fillRect(0, 0, 960, 640);
    }

    // ★ VFX 实时粒子动效叠加 ★
    VFX.render(this.ctx, dt, this.currentScene);

    // mask 静默 — 仅用于交互检测，不绘制视觉效果

    document.getElementById('scene-name').textContent = scene.name || '';
  },

  handleMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    this.mouseX = (e.clientX - rect.left) * (960 / rect.width);
    this.mouseY = (e.clientY - rect.top) * (640 / rect.height);

    const hotspot = this.getHotspot();
    const hint = document.getElementById('hint-text');

    if (hotspot) {
      this.canvas.style.cursor = 'pointer';
      hint.textContent = hotspot.label || '';
      hint.style.display = 'block';
    } else {
      this.canvas.style.cursor = 'crosshair';
      hint.style.display = 'none';
    }
  },

  handleClick(e) {
    if (this.dialogueActive) return;

    const rect = this.canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (960 / rect.width);
    const y = (e.clientY - rect.top) * (640 / rect.height);

    const hotspot = this.getHotspotAt(x, y);
    if (hotspot) {
      hotspot.action();
    }
  },

  getHotspot() {
    return this.getHotspotAt(this.mouseX, this.mouseY);
  },

  getHotspotAt(x, y) {
    const scene = SCENES[this.currentScene];
    if (!scene || !scene.hotspots) return null;

    if (this.masks[this.currentScene]) {
      for (const hs of scene.hotspots) {
        if (hs.condition && !hs.condition()) continue;

        if (hs.maskId) {
          const key = `${this.currentScene}_${hs.maskId}`;
          const objMask = this.objMasks[key];
          if (objMask) {
            const px = Math.floor(x), py = Math.floor(y);
            if (px >= 0 && px < 960 && py >= 0 && py < 640) {
              if (objMask.data.data[(py * 960 + px) * 4] > 128) {
                return hs;
              }
            }
          }
        } else if (hs.isEdge) {
          if (this.isMaskHit(x, y)) return hs;
        }
      }
      return null;
    }

    for (const hs of scene.hotspots) {
      if (hs.condition && !hs.condition()) continue;
      if (x >= hs.x && x <= hs.x + hs.w && y >= hs.y && y <= hs.y + hs.h) {
        return hs;
      }
    }
    return null;
  },

  // ---- 关键词微震系统 ----
  KEYWORDS: [
    // 核心人名
    '凯', 'Oracle', '影子', '酒保', '魏', '魏明远', '搭档',

    '公寓', '霓虹街', 'The Rust', '小巷', 'B7', 'B7 层',
    '核心控制室', '实验舱',
    // 关键物品
    '安全卡', '数据芯片', '芯片', '加密芯片', '终端',
    '解密信息', '电击枪', '神经链接器', '通行证',
    // 关键概念
    '信号', '真相', '加密', '解密', '数据',
    '幽灵黑客', '神经网络', '分布式计算', '脑死亡',
    '活人做实验', '证据', '公开', '意识', '断电',
    '排斥反应', '集体意识', '节点',
    // 重要数字
    '2087', '77.3 MHz', '144.7 MHz', '三年前', '三年', '地下三层', '地下七层',
    '3号测试对象', '13号', '12个',
  ],

  _buzzApplied: false,

  _applyKeywordBuzz(el) {
    if (this._buzzApplied) return;
    this._buzzApplied = true;

    const raw = el.textContent;
    // 按长度降序排列，优先匹配长词
    const sorted = [...this.KEYWORDS].sort((a, b) => b.length - a.length);
    // 构建正则，转义特殊字符
    const escaped = sorted.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const re = new RegExp(`(${escaped.join('|')})`, 'g');

    const parts = raw.split(re);
    if (parts.length <= 1) return; // 没有命中

    el.innerHTML = '';
    for (const part of parts) {
      if (part && re.test(part)) {
        re.lastIndex = 0;
        const span = document.createElement('span');
        span.className = 'kw-buzz';
        span.textContent = part;
        el.appendChild(span);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    }
    re.lastIndex = 0;
  },

  // ---- 对话系统 ----
  showDialogue(speaker, text, choices, portrait) {
    return new Promise((resolve) => {
      this.dialogueActive = true;
      const box = document.getElementById('dialogue-box');
      const speakerEl = document.getElementById('dialogue-speaker');
      const textEl = document.getElementById('dialogue-text');
      const choicesEl = document.getElementById('dialogue-choices');
      const portraitEl = document.getElementById('dialogue-portrait');

      // 头像映射：根据角色名自动匹配，也可手动传入 portrait 参数覆盖
      const PORTRAIT_MAP = {
        '凯': 'portrait_kai',
        'Oracle': 'portrait_oracle',
        '???': 'portrait_oracle',
      };
      const resolvedPortrait = portrait || PORTRAIT_MAP[speaker];

      if (resolvedPortrait && this.images[resolvedPortrait]) {
        portraitEl.src = this.images[resolvedPortrait].src;
        portraitEl.classList.add('visible');
      } else {
        portraitEl.classList.remove('visible');
      }

      let speakerDisplay = speaker || '';

      speakerEl.textContent = speakerDisplay;
      textEl.textContent = '';
      choicesEl.innerHTML = '';
      box.style.display = 'block';

      let i = 0;
      let typing = true;
      this._buzzApplied = false;

      const finishTyping = () => {
        if (!typing) return;
        typing = false;
        clearInterval(typeTimer);
        box.removeEventListener('click', skipHandler);
        textEl.textContent = text;

        // 打字结束后：对关键词施加微震效果
        Game._applyKeywordBuzz(textEl);

        if (choices && choices.length > 0) {
          choices.forEach((c, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = `▸ ${c.text}`;
            btn.onclick = () => {
              this.hideDialogue();
              resolve(idx);
            };
            choicesEl.appendChild(btn);
          });
        } else {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = '▸ 继续...';
          btn.onclick = () => {
            this.hideDialogue();
            resolve(0);
          };
          choicesEl.appendChild(btn);
        }
      };

      // 点击对话框区域 → 跳过打字动画
      const skipHandler = (e) => {
        e.stopPropagation();
        finishTyping();
      };
      box.addEventListener('click', skipHandler);

      const typeTimer = setInterval(() => {
        if (i < text.length) {
          textEl.textContent += text[i];
          i++;
        } else {
          finishTyping();
        }
      }, 25);
    });
  },

  hideDialogue() {
    this.dialogueActive = false;
    document.getElementById('dialogue-box').style.display = 'none';
  },

  // ---- 物品系统 ----
  hasItem(id) {
    return this.inventory.includes(id);
  },

  addItem(id) {
    if (!this.hasItem(id)) {
      this.inventory.push(id);
      this.updateInventoryUI();
      this.showHint(`获得物品: ${ITEMS[id].name}`);
    }
  },

  removeItem(id) {
    this.inventory = this.inventory.filter(i => i !== id);
    if (this.selectedItem === id) this.selectedItem = null;
    this.updateInventoryUI();
  },

  // ---- 库存 UI ----
  buildInventoryUI() {
    const bar = document.getElementById('inventory-bar');
    bar.innerHTML = '';
    for (let i = 0; i < 6; i++) {
      const slot = document.createElement('div');
      slot.className = 'inv-slot';
      slot.dataset.index = i;
      slot.onclick = () => this.selectInventorySlot(i);
      bar.appendChild(slot);
    }
    this.updateInventoryUI();
  },

  updateInventoryUI() {
    const slots = document.querySelectorAll('.inv-slot');
    slots.forEach((slot, i) => {
      const itemId = this.inventory[i];
      if (itemId && ITEMS[itemId]) {
        const item = ITEMS[itemId];
        slot.className = 'inv-slot has-item';
        if (this.selectedItem === itemId) slot.classList.add('selected');
        slot.innerHTML = `${item.icon}<div class="inv-tooltip">${item.name}</div>`;
      } else {
        slot.className = 'inv-slot';
        slot.innerHTML = '';
      }
    });
  },

  selectInventorySlot(index) {
    const itemId = this.inventory[index];
    if (itemId) {
      this.selectedItem = this.selectedItem === itemId ? null : itemId;
      this.updateInventoryUI();
    }
  },

  updateHUD() {
    this.updateInventoryUI();
  },

  showHint(text, duration = 2000) {
    const el = document.getElementById('hint-text');
    el.textContent = text;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, duration);
  },

  // ---- 音效 ----
  initAudio() {
    try {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
  },

  playTone(freq, duration = 0.1, type = 'square') {
    if (!this.audioCtx) return;
    const osc = this.audioCtx.createOscillator();
    const gain = this.audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0.05;
    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.audioCtx.destination);
    osc.start();
    osc.stop(this.audioCtx.currentTime + duration);
  },

  sfx(type) {
    switch(type) {
      case 'click': this.playTone(800, 0.05); break;
      case 'pickup': this.playTone(600, 0.1); setTimeout(() => this.playTone(900, 0.1), 100); break;
      case 'door': this.playTone(200, 0.3, 'sawtooth'); break;
      case 'error': this.playTone(200, 0.15); setTimeout(() => this.playTone(150, 0.15), 150); break;
      case 'success': this.playTone(500, 0.1); setTimeout(() => this.playTone(700, 0.1), 100); setTimeout(() => this.playTone(1000, 0.15), 200); break;
    }
  },

  // ---- 结局 ----
  showEnding(title, lines) {
    const screen = document.getElementById('ending-screen');
    document.getElementById('ending-title').textContent = title;
    document.getElementById('ending-text').innerHTML = lines.map(l => `<p>${l}</p>`).join('');
    screen.style.display = 'flex';
  },

  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
};

                '十二个人醒来。你没有。',
                '',
                '但在网络深处，两个信号永远并行。',
                '一个叫凯。一个叫搭档。',
                '他们终于又在一起了。',
                '',
                '— LAST SIGNAL · 永恒 —',
              ]);
            });
          }
        });
      } else {
        Game.showDialogue('凯', '控制台就在那里。断电开关……还是接入端口……\n\n我必须做出选择。', [
          { text: '拉下断电开关' },
          { text: '接入神经链接器' },
        ]).then(choice => {
          if (choice === 0) {
            Game.sfx('success');
            Game.showEnding('LAST SIGNAL — 信号不止', [
              '你拉下了红色拉杆。',
              '',
              'LASTLIGHT 项目永久终止。',
              '十二名测试对象恢复意识。',
              '魏明远被逮捕。',
              '',
              'Oracle 在医院看到了真实的阳光。',
              '',
              '— LAST SIGNAL · 完 —',
            ]);
          } else {
            Game.sfx('click');
            Game.showEnding('LAST SIGNAL — 永恒信号', [
              '你戴上了神经链接器。',
              '',
              '在数据洪流中，你找到了搭档。',
              '两个信号永远并行。',
              '',
              '— LAST SIGNAL · 永恒 —',
            ]);
          }
        });
      }
    },

    hotspots: []
  },
};


// ============================================================
// 启动
// ============================================================
Game.init();
</script>
