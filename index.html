      mouth:    { type: 'arc', open: 0.4, width: 0.45, y: 0.68, teeth: false },
      browL:    { angle: 0.15 },
      browR:    { angle: -0.05 },
      blush:    0.25,
    },
    { // 2: 邪恶笑
      name: 'evil',
      leftEye:  { cx: 0.30, cy: 0.36, w: 0.14, h: 0.10, shape: 'square' },
      rightEye: { cx: 0.70, cy: 0.36, w: 0.14, h: 0.10, shape: 'square' },
      mouth:    { type: 'zigzag', open: 0.8, width: 0.60, y: 0.66, teeth: true },
      browL:    { angle: -0.25 },
      browR:    { angle: 0.25 },
      blush:    0.10,
    },
    { // 3: 惊讶 O
      name: 'surprised',
      leftEye:  { cx: 0.30, cy: 0.38, w: 0.16, h: 0.16, shape: 'circle' },
      rightEye: { cx: 0.70, cy: 0.38, w: 0.16, h: 0.16, shape: 'circle' },
      mouth:    { type: 'circle', open: 1.0, width: 0.18, y: 0.70, teeth: false },
      browL:    { angle: -0.3 },
      browR:    { angle: 0.3 },
      blush:    0.05,
    },
    { // 4: 哭笑脸
      name: 'crylaugh',
      leftEye:  { cx: 0.30, cy: 0.40, w: 0.10, h: 0.03, shape: 'line' },
      rightEye: { cx: 0.70, cy: 0.40, w: 0.10, h: 0.03, shape: 'line' },
      mouth:    { type: 'arc', open: 0.9, width: 0.55, y: 0.66, teeth: true },
      browL:    { angle: 0.2 },
      browR:    { angle: -0.2 },
      blush:    0.30,
      tears:    true,
    },
    { // 5: 无表情
      name: 'blank',
      leftEye:  { cx: 0.30, cy: 0.38, w: 0.12, h: 0.12, shape: 'square' },
      rightEye: { cx: 0.70, cy: 0.38, w: 0.12, h: 0.12, shape: 'square' },
      mouth:    { type: 'line', open: 0, width: 0.35, y: 0.68, teeth: false },
      browL:    { angle: 0 },
      browR:    { angle: 0 },
      blush:    0,
    },
  ],

  // 面部参数序列（循环播放）
  sequence: [0, 1, 0, 2, 3, 0, 4, 5, 0],
  seqIndex: 0,

  init() {
    this.canvas = document.getElementById('dialogue-portrait-canvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
  },

  start() {
    if (this.running) return;
    this.running = true;
    this.time = 0;
    this.seqIndex = 0;
    this.currentFace = this.sequence[0];
    this.transitionProgress = 1;
    this._lastTime = performance.now();
    this._tick();
  },

  stop() {
    this.running = false;
  },

  _tick() {
    if (!this.running) return;
    const now = performance.now();
    const dt = (now - this._lastTime) / 1000;
    this._lastTime = now;
    this.time += dt;

    // 面部切换过渡
    this.transitionProgress += this.transitionSpeed * dt;
    if (this.transitionProgress >= 1) {
      this.transitionProgress = 0;
      this.seqIndex = (this.seqIndex + 1) % this.sequence.length;
      this.currentFace = this.sequence[this.seqIndex];
    }

    // 随机故障
    this.glitchTimer += dt;
    if (!this.glitchActive && this.glitchTimer > 2 + Math.random() * 4) {
      this.glitchActive = true;
      this.glitchTimer = 0;
      setTimeout(() => { this.glitchActive = false; }, 60 + Math.random() * 100);
    }

    this._draw();
    requestAnimationFrame(() => this._tick());
  },

  _lerp(a, b, t) { return a + (b - a) * t; },

  _lerpFace(faceA, faceB, t) {
    // 平滑插值 t: 用 smoothstep
    const s = t * t * (3 - 2 * t);
    return {
      leftEye:  {
        cx: this._lerp(faceA.leftEye.cx, faceB.leftEye.cx, s),
        cy: this._lerp(faceA.leftEye.cy, faceB.leftEye.cy, s),
        w:  this._lerp(faceA.leftEye.w,  faceB.leftEye.w,  s),
        h:  this._lerp(faceA.leftEye.h,  faceB.leftEye.h,  s),
        shape: s < 0.5 ? faceA.leftEye.shape : faceB.leftEye.shape,
      },
      rightEye: {
        cx: this._lerp(faceA.rightEye.cx, faceB.rightEye.cx, s),
        cy: this._lerp(faceA.rightEye.cy, faceB.rightEye.cy, s),
        w:  this._lerp(faceA.rightEye.w,  faceB.rightEye.w,  s),
        h:  this._lerp(faceA.rightEye.h,  faceB.rightEye.h,  s),
        shape: s < 0.5 ? faceA.rightEye.shape : faceB.rightEye.shape,
      },
      mouth: {
        type:  s < 0.5 ? faceA.mouth.type : faceB.mouth.type,
        open:  this._lerp(faceA.mouth.open, faceB.mouth.open, s),
        width: this._lerp(faceA.mouth.width, faceB.mouth.width, s),
        y:     this._lerp(faceA.mouth.y, faceB.mouth.y, s),
        teeth: s < 0.5 ? faceA.mouth.teeth : faceB.mouth.teeth,
      },
      browL: { angle: this._lerp(faceA.browL.angle, faceB.browL.angle, s) },
      browR: { angle: this._lerp(faceA.browR.angle, faceB.browR.angle, s) },
      blush: this._lerp(faceA.blush, faceB.blush, s),
      tears: s < 0.5 ? (faceA.tears || false) : (faceB.tears || false),
    };
  },

  _draw() {
    const c = this.ctx;
    const W = 160, H = 160;
    c.clearRect(0, 0, W, H);

    // 获取当前插值面部
    const faceIdx = this.sequence[this.seqIndex];
    const nextIdx = this.sequence[(this.seqIndex + 1) % this.sequence.length];
    const face = this._lerpFace(this.faces[faceIdx], this.faces[nextIdx], this.transitionProgress);

    // 背景
    c.fillStyle = '#0a0a14';
    c.fillRect(0, 0, W, H);

    // 网格
    c.strokeStyle = 'rgba(0,255,136,0.08)';
    c.lineWidth = 0.5;
    for (let x = 0; x < W; x += 16) { c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
    for (let y = 0; y < H; y += 16) { c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }

    // 脸轮廓
    c.beginPath();
    c.arc(W/2, H/2, 62, 0, Math.PI*2);
    c.strokeStyle = '#00ff88';
    c.lineWidth = 2;
    c.stroke();
    c.fillStyle = 'rgba(0,255,136,0.03)';
    c.fill();

    // 腮红
    if (face.blush > 0.01) {
      c.fillStyle = `rgba(255,0,80,${face.blush})`;
      c.beginPath(); c.arc(W*0.22, H*0.55, 12, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(W*0.78, H*0.55, 12, 0, Math.PI*2); c.fill();
    }

    // 眉毛
    this._drawBrow(c, face.leftEye.cx - 0.02, face.leftEye.cy - 0.10, face.browL.angle, W, H);
    this._drawBrow(c, face.rightEye.cx + 0.02, face.rightEye.cy - 0.10, face.browR.angle, W, H);

    // 眼睛
    this._drawEye(c, face.leftEye, W, H);
    this._drawEye(c, face.rightEye, W, H);

    // 嘴巴
    this._drawMouth(c, face.mouth, W, H);

    // 泪水
    if (face.tears) {
      c.fillStyle = 'rgba(0,180,255,0.5)';
      const tearY = (this.time * 40) % 30;
      c.beginPath(); c.arc(W*0.28, H*0.44 + tearY, 3, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(W*0.72, H*0.44 + tearY + 5, 2.5, 0, Math.PI*2); c.fill();
    }

    // 故障效果
    if (this.glitchActive) {
      // 横向错位
      const sliceY = Math.floor(Math.random() * H);
      const sliceH = 2 + Math.floor(Math.random() * 8);
      const imgData = c.getImageData(0, sliceY, W, sliceH);
      c.putImageData(imgData, (Math.random()-0.5)*8, sliceY);

      // 色偏叠加
      c.globalCompositeOperation = 'screen';
      c.fillStyle = `rgba(255,0,60,${0.06+Math.random()*0.06})`;
      c.fillRect(0,0,W,H);
      c.globalCompositeOperation = 'source-over';
    }

    // 扫描线
    c.fillStyle = 'rgba(0,0,0,0.06)';
    for (let y = (this.time * 60) % 8; y < H; y += 4) {
      c.fillRect(0, y, W, 1);
    }
  },

  _drawBrow(c, cx, cy, angle, W, H) {
    const x = cx * W, y = cy * H;
    c.save();
    c.translate(x, y);
    c.rotate(angle);
    c.strokeStyle = '#00ff88';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(-10, 0); c.lineTo(10, 0);
    c.stroke();
    c.restore();
  },

  _drawEye(c, eye, W, H) {
    const x = eye.cx * W, y = eye.cy * H;
    const w = eye.w * W, h = eye.h * H;

    c.fillStyle = '#00ff88';
    c.strokeStyle = '#00ff88';

    if (eye.shape === 'square') {
      c.fillRect(x - w/2, y - h/2, w, h);
      // 瞳孔
      c.fillStyle = '#0a0a14';
      c.fillRect(x - w/4, y - h/4, w/2, h/2);
      // 高光
      c.fillStyle = '#fff';
      c.fillRect(x - w/4 + 2, y - h/4, 4, 4);
    } else if (eye.shape === 'circle') {
      c.beginPath();
      c.arc(x, y, w/2, 0, Math.PI*2);
      c.fill();
      c.fillStyle = '#0a0a14';
      c.beginPath();
      c.arc(x, y, w/4, 0, Math.PI*2);
      c.fill();
      c.fillStyle = '#fff';
      c.fillRect(x - 2, y - w/4, 3, 3);
    } else if (eye.shape === 'line') {
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(x - w/2, y); c.lineTo(x + w/2, y);
      c.stroke();
    }
  },

  _drawMouth(c, mouth, W, H) {
    const x = W/2;
    const y = mouth.y * H;
    const hw = mouth.width * W / 2;

    c.strokeStyle = '#00ff88';
    c.fillStyle = '#00ff88';
    c.lineWidth = 2;

    if (mouth.type === 'arc') {
      const openH = mouth.open * 25;
      c.beginPath();
      c.moveTo(x - hw, y);
      // 锯齿弧线
      const steps = 8;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const px = x - hw + t * hw * 2;
        const py = y + Math.sin(t * Math.PI) * openH;
        const zigzag = (i % 2 === 1) ? -4 : 0;
        c.lineTo(px, py + zigzag);
      }
      c.stroke();
      if (mouth.open > 0.3) {
        c.fillStyle = 'rgba(0,255,136,0.08)';
        c.fill();
      }
      // 牙齿
      if (mouth.teeth && mouth.open > 0.3) {
        c.strokeStyle = '#00ff88';
        c.lineWidth = 1;
        const teethCount = Math.floor(hw / 10);
        for (let i = 1; i < teethCount; i++) {
          const tx = x - hw + (i / teethCount) * hw * 2;
          const tH = 4 + Math.sin(i * 1.7) * 3;
          c.strokeRect(tx - 3, y, 6, tH);
        }
      }
    } else if (mouth.type === 'zigzag') {
      const openH = mouth.open * 22;
      c.beginPath();
      const segs = 10;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const px = x - hw + t * hw * 2;
        const py = y + (i % 2 === 0 ? 0 : openH);
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.stroke();
      if (mouth.teeth) {
        c.lineWidth = 1;
        for (let i = 1; i < segs; i += 2) {
          const tx = x - hw + (i / segs) * hw * 2;
          c.strokeRect(tx - 3, y, 6, 6);
        }
      }
    } else if (mouth.type === 'circle') {
      c.beginPath();
      c.arc(x, y, mouth.width * W / 2, 0, Math.PI * 2);
      c.stroke();
      c.fillStyle = 'rgba(0,255,136,0.1)';
      c.fill();
    } else if (mouth.type === 'line') {
      c.beginPath();
      c.moveTo(x - hw, y); c.lineTo(x + hw, y);
      c.stroke();
    }
  },
};


// ============================================================
// CHARACTER SYSTEM — 角色行走与深度排序
// ============================================================
const CharSystem = {
  // 角色状态: { id, x, y, dir, frame, animTimer, targetX, targetY, walking, speed, visible }
  chars: {},
  // 已加载的精灵图: { charId: { dir_fN: Image } }
  sprites: {},
  // 场景深度图数据 (用于深度排序)
  depthData: null,
  // 行走区域 mask 数据
  walkMask: null,

  SPRITE_SIZE: 128,
  WALK_SPEED: 0.12,        // 归一化坐标/秒
  ANIM_INTERVAL: 120,      // 帧切换间隔 ms (8帧更快切换)
  CHAR_SCALE: 0.25,        // 角色缩放 (相对于画面)
  DEPTH_THRESHOLD: 0.05,   // 深度差阈值 (遮挡判断)
  WALK_FRAMES: 8,          // 行走帧数 (v2: 8帧更流畅)

  // ── 初始化场景角色 ──
  async initScene(sceneId, images) {
    const scene = SCENES[sceneId];
    if (!scene || !scene.characters) {
      this.chars = {};
      return;
    }

    // 加载行走 mask
    await this._loadWalkMask(sceneId);

    // 加载深度图
    await this._loadDepthMap(sceneId);

    // 初始化角色状态
    const newChars = {};
    for (const cfg of scene.characters) {
      const id = cfg.id;
      // 保留已有状态（跨场景切换保持位置）
      if (this.chars[id]) {
        newChars[id] = { ...this.chars[id], ...cfg };
        newChars[id].visible = cfg.visible !== false;
      } else {
        newChars[id] = {
          id,
          x: cfg.x || 0.5,
          y: cfg.y || 0.7,
          dir: cfg.dir || 'down',
          frame: 0,
          animTimer: 0,
          targetX: null,
          targetY: null,
          walking: false,
          speed: cfg.speed || this.WALK_SPEED,
          visible: cfg.visible !== false,
          scale: cfg.scale || this.CHAR_SCALE,
          depth: cfg.depth || null,  // 固定深度 (null = 用Y推算)
        };
      }
    }
    this.chars = newChars;

    // 加载精灵图
    await this._loadSprites(images);
  },

  // ── 加载精灵图 ──
  async _loadSprites(images) {
    const loadImg = (src) => { DebugLogger._startLoad(src, 'sprite'); return new Promise(resolve => {
      const img = new Image();
      img.onload = () => { DebugLogger._endLoad(src, true); resolve(img); };
      img.onerror = () => { DebugLogger._endLoad(src, false, { reason: 'load error' }); resolve(null); };
      img.src = src;
    }); };

    const dirs = ['down', 'left', 'right', 'up'];
    const promises = [];

    for (const [id, char] of Object.entries(this.chars)) {
      if (this.sprites[id]) continue; // 已加载

      this.sprites[id] = {};
      for (const dir of dirs) {
        for (let fi = 0; fi < this.WALK_FRAMES; fi++) {
          const key = `${dir}_f${fi}`;
          const path = `assets/sprites/${id}_${key}.webp`;
          promises.push(
            loadImg(path).then(img => {
              if (img) this.sprites[id][key] = img;
            })
          );
        }
      }
    }

    await Promise.all(promises);
  },

  // ── 加载行走 mask ──
  async _loadWalkMask(sceneId) {
    this.walkMask = null;
    // 优先使用 walkable mask，否则使用场景交互 mask
    const maskNames = [
      `assets/masks/${sceneId}_walkable_mask.webp`,
      `assets/masks/${sceneId}_mask.webp`,
    ];

    for (const path of maskNames) {
      DebugLogger._startLoad(path, 'walk-mask');
      try {
        const img = new Image();
        const loaded = await new Promise(resolve => {
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = path;
        });
        if (loaded) {
          const c = document.createElement('canvas');
          c.width = 960; c.height = 640;
          const cx = c.getContext('2d', { willReadFrequently: true });
          cx.drawImage(img, 0, 0, 960, 640);
          this.walkMask = cx.getImageData(0, 0, 960, 640);
          DebugLogger._endLoad(path, true, { size: '960x640' });
          break;
        } else {
          DebugLogger._endLoad(path, false, { reason: 'not found (fallback)' });
        }
      } catch (e) { DebugLogger._endLoad(path, false, { reason: e.message }); /* continue */ }
    }
  },

  // ── 加载深度图 ──
  async _loadDepthMap(sceneId) {
    this.depthData = null;
    const depthNames = [
      `assets/${sceneId}_depth.webp`,
      `assets/depth_${sceneId}.png`,
    ];

    for (const path of depthNames) {
      DebugLogger._startLoad(path, 'depth-map');
      try {
        const img = new Image();
        const loaded = await new Promise(resolve => {
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = path;
        });
        if (loaded) {
          const c = document.createElement('canvas');
          c.width = 960; c.height = 640;
          const cx = c.getContext('2d', { willReadFrequently: true });
          cx.drawImage(img, 0, 0, 960, 640);
          this.depthData = cx.getImageData(0, 0, 960, 640);
          DebugLogger._endLoad(path, true, { size: '960x640' });
          break;
        } else {
          DebugLogger._endLoad(path, false, { reason: 'not found (fallback)' });
        }
      } catch (e) { DebugLogger._endLoad(path, false, { reason: e.message }); /* continue */ }
    }
  },

  // ── 检查位置是否可行走 ──
  isWalkable(nx, ny) {
    if (!this.walkMask) return true; // 无 mask 则允许行走
    const px = Math.floor(nx * 960);
    const py = Math.floor(ny * 640);
    if (px < 0 || px >= 960 || py < 0 || py >= 640) return false;
    const idx = (py * 960 + px) * 4;
    return this.walkMask.data[idx] > 128;
  },

  // ── 获取深度值 (0=near, 1=far) ──
  getDepth(nx, ny) {
    if (!this.depthData) {
      // 无深度图：用 Y 坐标推算 (下方=近, 上方=远)
      return 1.0 - ny;
    }
    const px = Math.floor(nx * 960);
    const py = Math.floor(ny * 640);
    if (px < 0 || px >= 960 || py < 0 || py >= 640) return 0.5;
    const idx = (py * 960 + px) * 4;
    // Depth-Anything 输出: white=near, black=far
    // 游戏需要: 0=near, 1=far → 取反
    return 1.0 - (this.depthData.data[idx] / 255);
  },

  // ── 移动角色到目标位置 ──
  moveTo(charId, tx, ty) {
    const char = this.chars[charId];
    if (!char || !char.visible) return;

    // 检查目标是否可行走
    if (!this.isWalkable(tx, ty)) return;

    char.targetX = tx;
    char.targetY = ty;
    char.walking = true;
  },

  // ── 更新所有角色 ──
  update(dt) {
    for (const [id, char] of Object.entries(this.chars)) {
      if (!char.visible) continue;

      // 行走移动
      if (char.walking && char.targetX != null) {
        const dx = char.targetX - char.x;
        const dy = char.targetY - char.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 0.01) {
          // 到达目标
          char.x = char.targetX;
          char.y = char.targetY;
          char.walking = false;
          char.targetX = null;
          char.targetY = null;
          char.frame = 0;
        } else {
          // 移动
          const step = char.speed * dt / 1000;
          const ratio = Math.min(step / dist, 1);
          const nx = char.x + dx * ratio;
          const ny = char.y + dy * ratio;

          // 碰撞检测
          if (this.isWalkable(nx, ny)) {
            char.x = nx;
            char.y = ny;
          } else {
            // 尝试只沿 X 或只沿 Y 移动 (滑墙)
            if (this.isWalkable(nx, char.y)) {
              char.x = nx;
            } else if (this.isWalkable(char.x, ny)) {
              char.y = ny;
            } else {
              // 完全卡住，停止
              char.walking = false;
              char.targetX = null;
              char.targetY = null;
            }
          }

          // 更新朝向
          if (Math.abs(dx) > Math.abs(dy)) {
            char.dir = dx > 0 ? 'right' : 'left';
          } else {
            char.dir = dy > 0 ? 'down' : 'up';
          }
        }
      }

      // 行走动画
      if (char.walking) {
        char.animTimer += dt;
        if (char.animTimer >= this.ANIM_INTERVAL) {
          char.animTimer -= this.ANIM_INTERVAL;
          char.frame = (char.frame + 1) % this.WALK_FRAMES;
        }
      } else {
        char.frame = 0;
        char.animTimer = 0;
      }
    }
  },

  // ── 渲染所有角色 (深度排序) ──
  render(ctx) {
    // 收集可见角色并按深度排序
    const visible = [];
    for (const [id, char] of Object.entries(this.chars)) {
      if (!char.visible) continue;
      const depth = char.depth != null ? char.depth : this.getDepth(char.x, char.y);
      visible.push({ char, depth });
    }

    // 按深度排序 (远→近, 即 depth 大的先画)
    visible.sort((a, b) => b.depth - a.depth);

    for (const { char, depth } of visible) {
      this._drawChar(ctx, char, depth);
    }
  },

  // ── 绘制单个角色 ──
  // ── 场景主色调映射 ──
  SCENE_TINT: {
    apartment: { r: 80, g: 255, b: 180, strength: 0.08 },   // 暖绿台灯光
    street:    { r: 0, g: 200, b: 255, strength: 0.12 },     // 霓虹青
    bar:       { r: 200, g: 50, b: 180, strength: 0.15 },    // 紫红霓虹
    alley:     { r: 50, g: 255, b: 100, strength: 0.10 },    // 绿色全息屏
    tower:     { r: 180, g: 60, b: 60, strength: 0.10 },     // 红色扫描仪
    server:    { r: 0, g: 255, b: 136, strength: 0.08 },     // 服务器绿灯
    rooftop:   { r: 100, g: 140, b: 255, strength: 0.10 },   // 城市冷蓝光
    underground: { r: 200, g: 40, b: 40, strength: 0.14 },   // 红色应急灯
    core:      { r: 0, g: 255, b: 136, strength: 0.18 },     // 核心绿光
  },

  _drawChar(ctx, char, depth) {
    const spriteKey = `${char.dir}_f${char.frame}`;
    let sprite = this.sprites[char.id]?.[spriteKey];
    // 帧不存在时降级到 f0
    if (!sprite) sprite = this.sprites[char.id]?.[`${char.dir}_f0`];
    if (!sprite) return; // 精灵图未加载

    // 角色尺寸 (根据深度缩放 — 远处小, 近处大)
    // 精灵帧是 64×128 (宽高比 1:2)，按比例绘制避免拉宽
    const depthScale = 0.6 + (1.0 - depth) * 0.8;
    const baseSize = 960 * char.scale;
    const h = baseSize * depthScale;
    const w = h * (sprite.width / sprite.height); // 保持原始宽高比

    // 角色位置 (脚部对齐 Y 坐标)
    const px = char.x * 960 - w / 2;
    const py = char.y * 640 - h;
    const footY = char.y * 640;

    // 深度遮挡：如果角色深度 > 场景深度，降低不透明度 (被遮挡)
    const sceneDepth = this.getDepth(char.x, char.y);
    const occlusion = depth > sceneDepth + this.DEPTH_THRESHOLD ? 0.4 : 1.0;

    // 获取场景色调
    const sceneId = Game.currentScene || 'apartment';
    const tint = this.SCENE_TINT[sceneId] || this.SCENE_TINT.apartment;
    const hasRain = VFX?.SCENE_CONFIG?.[sceneId]?.rain?.count > 0;
    const hasPuddle = VFX?.SCENE_CONFIG?.[sceneId]?.puddleReflection?.enabled;

    ctx.save();

    // ═══ 1. 角色倒影 (雨天/积水场景) ═══
    if ((hasRain || hasPuddle) && occlusion > 0.5) {
      ctx.save();

      // 用离屏 canvas 绘制倒影，避免 destination-out 擦掉主 canvas 背景
      if (!this._reflectBuf) {
        this._reflectBuf = document.createElement('canvas');
        this._reflectBuf.width = 960;
        this._reflectBuf.height = 640;
      }
      const rbuf = this._reflectBuf;
      const rctx = rbuf.getContext('2d');
      rctx.clearRect(0, 0, 960, 640);

      // 在离屏 canvas 上绘制翻转的角色
      rctx.save();
      rctx.globalAlpha = 0.15;
      rctx.translate(0, footY * 2);
      rctx.scale(1, -1);
      rctx.imageSmoothingEnabled = false;
      rctx.drawImage(sprite, px, py, w, h);
      rctx.restore();

      // 用渐隐蒙版擦除倒影下半部分（从脚部向下淡出）
      const fadeGrad = rctx.createLinearGradient(0, footY, 0, footY + h * 0.5);
      fadeGrad.addColorStop(0, 'rgba(0,0,0,0)');
      fadeGrad.addColorStop(1, 'rgba(0,0,0,1)');
      rctx.globalCompositeOperation = 'destination-out';
      rctx.fillStyle = fadeGrad;
      rctx.fillRect(px - 2, footY, w + 4, h * 0.5);

      // 将离屏 canvas 合成到主 canvas
      ctx.globalAlpha = occlusion;
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(rbuf, 0, 0);

      ctx.restore();
    }

    // ═══ 2. 角色阴影 (脚下椭圆 — 增强版) ═══
    ctx.globalAlpha = 0.4 * occlusion;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(char.x * 960, footY, w * 0.35, h * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();

    // 雨天场景加一层环境色阴影
    if (hasRain) {
      ctx.globalAlpha = 0.08 * occlusion;
      ctx.fillStyle = `rgb(${tint.r}, ${tint.g}, ${tint.b})`;
      ctx.beginPath();
      ctx.ellipse(char.x * 960, footY + 1, w * 0.4, h * 0.04, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ═══ 3. 角色本体 + 环境光映射 ═══
    ctx.globalAlpha = occlusion;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sprite, px, py, w, h);

    // 环境光叠加：用 screen 混合模式叠一层场景色调
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = tint.strength * occlusion;
    ctx.drawImage(sprite, px, py, w, h);
    ctx.globalCompositeOperation = 'source-over';

    // 用场景色调给角色边缘加一圈微弱光晕
    ctx.globalAlpha = tint.strength * 0.6 * occlusion;
    ctx.shadowColor = `rgb(${tint.r}, ${tint.g}, ${tint.b})`;
    ctx.shadowBlur = 8;
    ctx.drawImage(sprite, px, py, w, h);
    ctx.shadowBlur = 0;

    ctx.restore();
  },

  // ── 清除场景角色 ──
  clear() {
    this.chars = {};
    this.depthData = null;
    this.walkMask = null;
  },
};


// ============================================================
// LOADING TRACKER — 素材加载进度追踪
// ============================================================
const LoadingTracker = {
  total: 0,
  loaded: 0,
  barWrap: null,
  barFill: null,
  textEl: null,
  current: '',

  init() {
    this.barWrap = document.getElementById('loading-bar-wrap');
    this.barFill = document.getElementById('loading-bar-fill');
    this.textEl = document.getElementById('loading-text');
    this.total = 0;
    this.loaded = 0;
    this.current = '';
  },

  show() {
    if (this.barWrap) this.barWrap.style.display = 'block';
    if (this.textEl) this.textEl.style.display = 'block';
  },

  hide() {
    if (this.barWrap) this.barWrap.style.display = 'none';
    if (this.textEl) this.textEl.style.display = 'none';
  },

  addTotal(n) {
    this.total += n;
  },

  setCurrent(label) {
    this.current = label;
    this._updateText();
  },

  _updateText() {
    const pct = this.total > 0 ? Math.floor((this.loaded / this.total) * 100) : 0;
    if (this.barFill) this.barFill.style.width = pct + '%';
    if (this.textEl) {
      const cur = this.current ? ` · ${this.current}` : '';
      this.textEl.textContent = `LOADING ${pct}%${cur}`;
    }
  },

  tick() {
    this.loaded++;
    this._updateText();
  },

  // 返回一个包装后的图片加载函数，自动追踪进度
  loadImage(src) {
    DebugLogger._startLoad(src, 'image');
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { this.tick(); DebugLogger._endLoad(src, true); resolve(img); };
      img.onerror = () => { this.tick(); DebugLogger._endLoad(src, false, { reason: 'load error' }); resolve(null); };
      img.src = src;
    });
  },

  // 返回一个包装后的 mask 加载函数
  loadMask(url) {
    DebugLogger._startLoad(url, 'mask');
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 960; c.height = 640;
        const cx = c.getContext('2d', { willReadFrequently: true });
        cx.drawImage(img, 0, 0, 960, 640);
        const data = cx.getImageData(0, 0, 960, 640);
        this.tick();
        DebugLogger._endLoad(url, true, { size: '960x640' });
        resolve({ canvas: c, ctx: cx, data });
      };
      img.onerror = () => { this.tick(); DebugLogger._endLoad(url, false, { reason: 'load error' }); resolve(null); };
      img.src = url;
    });
  },

  done() {
    if (this.barFill) this.barFill.style.width = '100%';
    if (this.textEl) this.textEl.textContent = 'LOADING COMPLETE';
    // 调试模式：打印加载摘要
    if (DebugLogger.enabled) DebugLogger.printSummary();
    // 短暂延迟后隐藏，显示开始按钮
    setTimeout(() => {
      this.hide();
      const btn = document.getElementById('start-btn');
      if (btn) btn.style.display = '';
    }, 400);
  },
};


// ============================================================
// DEBUG LOGGER — 调试模式：追踪所有资源加载
// 启用方式: URL 加 ?debug 参数 (例: index.html?debug)
// ============================================================
const DebugLogger = {
  enabled: new URLSearchParams(location.search).has('debug'),
  entries: [],
  _pending: new Map(),  // src -> { startTime }

  _startLoad(src, type) {
    if (!this.enabled) return;
    this._pending.set(src, { type, startTime: performance.now() });
  },

  _endLoad(src, success, extra) {
    if (!this.enabled) return;
    const p = this._pending.get(src);
    if (!p) return;
    this._pending.delete(src);
    const elapsed = performance.now() - p.startTime;
    this.entries.push({
      src,
      type: p.type,
      success,
      elapsed: Math.round(elapsed),
      size: extra?.size || null,
      reason: extra?.reason || null,
    });
  },

  printSummary() {
    if (!this.enabled) return;
    const ok = this.entries.filter(e => e.success);
    const fail = this.entries.filter(e => !e.success);
    const totalMs = Math.round(ok.reduce((s, e) => s + e.elapsed, 0));

    // ── 控制台输出 ──
    console.log('%c╔══════════════════════════════════════════════════╗', 'color:#00ff88;font-weight:bold');
    console.log('%c║   🔍 DEBUG MODE — 资源加载报告                  ║', 'color:#00ff88;font-weight:bold');
    console.log('%c╚══════════════════════════════════════════════════╝', 'color:#00ff88;font-weight:bold');
    console.log(`%c总计加载: ${this.entries.length} 个资源  |  成功: ${ok.length}  |  失败: ${fail.length}  |  总耗时: ${totalMs}ms`, 'color:#c0c0c0');
    console.log('');

    // 按类型分组
    const groups = {};
    for (const e of this.entries) {
      const g = e.type || 'other';
      if (!groups[g]) groups[g] = [];
      groups[g].push(e);
    }

    for (const [type, items] of Object.entries(groups)) {
      const typeOk = items.filter(i => i.success).length;
      const typeFail = items.filter(i => !i.success).length;
      console.log(`%c── ${type} (${items.length}) ── 成功:${typeOk} 失败:${typeFail}`, 'color:#00ff88;font-weight:bold');
      for (const item of items) {
        const icon = item.success ? '✅' : '❌';
        const ms = item.elapsed + 'ms';
        const sizeStr = item.size ? ` (${item.size})` : '';
        const failStr = item.reason ? ` [${item.reason}]` : '';
        console.log(`  ${icon} ${item.src}${sizeStr} — ${ms}${failStr}`);
      }
      console.log('');
    }

    // 汇总分析
    console.log('%c── 📊 加载分析 ──', 'color:#ffaa00;font-weight:bold');
    const byType = {};
    for (const e of ok) {
      if (!byType[e.type]) byType[e.type] = { count: 0, totalMs: 0 };
      byType[e.type].count++;
      byType[e.type].totalMs += e.elapsed;
    }
    for (const [t, v] of Object.entries(byType)) {
      console.log(`  ${t}: ${v.count} 个, 累计 ${v.totalMs}ms, 平均 ${Math.round(v.totalMs / v.count)}ms`);
    }
    if (fail.length > 0) {
      console.log(`%c  ⚠️ ${fail.length} 个资源加载失败（可能是可选资源）`, 'color:#ff4444');
    }
    console.log('%c─────────────────────────────────────────────────────', 'color:#00ff88');

    // ── 页面面板输出 ──
    this._renderPanel(ok, fail, totalMs, groups);
  },

  _renderPanel(ok, fail, totalMs, groups) {
    const panel = document.getElementById('debug-panel');
    if (!panel) return;
    panel.style.display = 'block';

    let html = `<div style="color:#00ff88;font-weight:bold;font-size:13px;margin-bottom:8px">🔍 DEBUG — 资源加载报告</div>`;
    html += `<div style="margin-bottom:8px;color:#888">总计:${this.entries.length} ✅${ok.length} ❌${fail.length} ⏱${totalMs}ms</div>`;

    for (const [type, items] of Object.entries(groups)) {
      const typeOk = items.filter(i => i.success).length;
      html += `<div style="color:#00ff88;font-weight:bold;margin:6px 0 2px">── ${type} (${items.length}) ── ✅${typeOk}</div>`;
      for (const item of items) {
        const icon = item.success ? '✅' : '❌';
        const color = item.success ? '#aaa' : '#ff4444';
        const name = item.src.split('/').pop();
        html += `<div style="color:${color};padding:1px 0">${icon} ${name} <span style="color:#666">${item.elapsed}ms</span>${item.reason ? ` <span style="color:#ff4444">[${item.reason}]</span>` : ''}</div>`;
      }
    }
    panel.innerHTML = html;
  },
};


// ============================================================
// LAST SIGNAL - Point & Click Adventure Engine
// ============================================================
const Game = {
  canvas: null,
  ctx: null,
  currentScene: null,
  inventory: [],
  flags: {},
  images: {},
  bgFrames: {},
  currentFrame: 0,
  frameTimer: 0,
  frameInterval: 83,
  masks: {},
  objMasks: {},
  waterMasks: {},
  selectedItem: null,
  dialogueActive: false,
  _pendingHotspot: null,
  mouseX: 0,
  mouseY: 0,
  audioCtx: null,

  // ── Real-time Lighting System ──
  lightingEngine: null,
  lightingCanvas: null,
  lightingConfig: null,
  useLighting: true, // toggle: true = real-time lighting, false = pre-generated frames

  async init() {
    this.canvas = document.getElementById('scene-canvas');
    this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    this.ctx.imageSmoothingEnabled = false;

    this.canvas.addEventListener('click', (e) => this.handleClick(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMove(e));

    // ── 初始化加载进度追踪 ──
    LoadingTracker.init();

    // ── Initialize real-time lighting engine ──
    await this._initLighting();

    // ── 统计所有待加载素材数量 ──
    this._countAssets();

    // ── 显示进度条 ──
    LoadingTracker.show();

    await this.loadAssets();
    this.buildInventoryUI();
    JokerFace.init();

    // ── 加载完成，显示开始按钮 ──
    LoadingTracker.done();
  },

  // 统计需要加载的素材总数 — 只统计第一个场景 + 主角（快速启动）
  _countAssets() {
    const firstSceneId = Object.keys(SCENES)[0];
    const portraits = ['portrait_kai', 'portrait_oracle', 'portrait_joker'];
    const EXPRESSIONS = ['happy', 'angry', 'sad', 'surprised', 'thinking', 'smirk'];

    let count = 0;

    // 第一个场景: 背景 + walkable mask + scene mask
    count += 3;

    // 头像 + 表情
    count += portraits.length + 3 * EXPRESSIONS.length;

    // 主角行走精灵 (kai, 4方向)
    const walkFrameCount = CharSystem.WALK_FRAMES || 6;
    count += 4 * walkFrameCount;

    // 第一个场景的对象 mask
    const firstScene = SCENES[firstSceneId];
    if (firstScene.hotspots) {
      for (const hs of firstScene.hotspots) {
        if (hs.maskId) count++;
      }
    }

    LoadingTracker.addTotal(count);
  },

  async _initLighting() {
    try {
      // Create offscreen WebGL canvas for lighting
      this.lightingCanvas = document.createElement('canvas');
      this.lightingCanvas.width = 960;
      this.lightingCanvas.height = 640;

      this.lightingEngine = new LightingEngine(this.lightingCanvas);

      // Load lighting config
      DebugLogger._startLoad('lighting-config.json', 'config');
      const resp = await fetch('lighting-config.json');
      this.lightingConfig = await resp.json();
      DebugLogger._endLoad('lighting-config.json', true, { size: 'json' });

      console.log('💡 Real-time lighting engine initialized');
    } catch (err) {
      console.warn('⚠️ Lighting engine init failed, falling back to pre-generated frames:', err);
      this.useLighting = false;
    }
  },

  // ── 首场景快速加载 + 后台异步加载剩余资源 ──
  async loadAssets() {
    const loadImg = (src) => LoadingTracker.loadImage(src);
    const loadMask = (url) => LoadingTracker.loadMask(url);
    const sceneIds = Object.keys(SCENES);
    const firstSceneId = sceneIds[0];
    const EXPRESSIONS = ['happy', 'angry', 'sad', 'surprised', 'thinking', 'smirk'];

    // ══════════════════════════════════════════════════
    // Phase 1: 阻塞加载 — 只加载首场景 + 全局资源 + 主角
    // ══════════════════════════════════════════════════

    // 全局资源 (头像、表情) 与首场景并行
    const globalDone = (async () => {
      for (const name of ['portrait_kai', 'portrait_oracle', 'portrait_joker']) {
        LoadingTracker.setCurrent(`portrait ${name}`);
        this.images[name] = await loadImg(`assets/${name}.webp`);
      }
      for (const char of ['kai', 'oracle', 'joker']) {
        for (const expr of EXPRESSIONS) {
          const key = `portrait_${char}_${expr}`;
          LoadingTracker.setCurrent(`expression ${key}`);
          this.images[key] = await loadImg(`assets/expressions/${char}_${expr}.webp`);
        }
      }
      LoadingTracker.setCurrent('portraits done');
    })();

    // 首场景: 背景 → mask → 主角精灵
    const scene = SCENES[firstSceneId];
    const bgName = scene.background;

    // 背景
    if (bgName && !this.images[bgName]) {
      LoadingTracker.setCurrent(`${firstSceneId} · background`);
      const img = await loadImg(`assets/${bgName}.webp`);
      this.images[bgName] = img;
      this.bgFrames[bgName] = img ? [img] : [];
    }

    // Walkable mask
    LoadingTracker.setCurrent(`${firstSceneId} · walkable mask`);
    await loadMask(`assets/masks/${firstSceneId}_walkable_mask.webp`).then(m => {
      if (m) this.masks[`${firstSceneId}_walkable`] = m;
    });

    // Scene mask
    LoadingTracker.setCurrent(`${firstSceneId} · scene mask`);
    await loadMask(`assets/masks/${firstSceneId}_mask.webp`).then(m => {
      this.masks[firstSceneId] = m;
    });

    // Water mask
    LoadingTracker.setCurrent(`${firstSceneId} · water mask`);
    await loadMask(`assets/masks/${firstSceneId}_water_mask.webp`).then(m => {
      if (m) this.waterMasks[firstSceneId] = m;
    });

    // 随机出生点：从 walkable mask 选取
    const [sx, sy] = this.getRandomSpawn(firstSceneId);
    if (scene.characters && scene.characters[0]) {
      scene.characters[0].x = sx;
      scene.characters[0].y = sy;
    }

    // Object masks
    if (scene.hotspots) {
      for (const hs of scene.hotspots) {
        if (hs.maskId) {
          LoadingTracker.setCurrent(`${firstSceneId} · mask ${hs.maskId}`);
          await loadMask(`assets/masks/${firstSceneId}_${hs.maskId}_mask.webp`).then(m => {
            if (m) this.objMasks[`${firstSceneId}_${hs.maskId}`] = m;
          });
        }
      }
    }

    // 主角行走精灵 (kai)
    const dirs = ['down', 'left', 'right', 'up'];
    const walkFrameCount = CharSystem.WALK_FRAMES || 6;
    for (const dir of dirs) {
      for (let fi = 0; fi < walkFrameCount; fi++) {
        const key = `kai_${dir}_f${fi}`;
        LoadingTracker.setCurrent(`sprite ${key}`);
        const img = await loadImg(`assets/sprites/${key}.webp`);
        if (img) {
          if (!CharSystem.sprites['kai']) CharSystem.sprites['kai'] = {};
          CharSystem.sprites['kai'][`${dir}_f${fi}`] = img;
        }
      }
    }

    // 等全局资源完成
    await globalDone;

    // 预计算首场景 mask
    this._precomputeMasks([firstSceneId]);

    // 标记首场景加载完成
    this._loadedScenes = new Set([firstSceneId]);
    this._allAssetsLoaded = false;

    // ══════════════════════════════════════════════════
    // Phase 2: 后台异步加载 — 不阻塞游戏启动
    // ══════════════════════════════════════════════════
    this._backgroundLoadAssets(sceneIds.slice(1));
  },

  // ── 后台加载剩余场景 ──
  async _backgroundLoadAssets(remainingSceneIds) {
    const loadImg = (src) => {
      const key = src.replace('assets/', '').replace(/\.\w+$/, '');
      if (this.images[key]) return Promise.resolve(this.images[key]);
      return LoadingTracker.loadImage(src);
    };
    const loadMask = (url) => LoadingTracker.loadMask(url);

    for (const sceneId of remainingSceneIds) {
      const scene = SCENES[sceneId];
      const bgName = scene.background;

      // 背景
      if (bgName && !this.images[bgName]) {
        LoadingTracker.setCurrent(`[bg] ${sceneId} · background`);
        const img = await loadImg(`assets/${bgName}.webp`);
        this.images[bgName] = img;
        this.bgFrames[bgName] = img ? [img] : [];
      }

      // Walkable mask
      LoadingTracker.setCurrent(`[bg] ${sceneId} · walkable mask`);
      await loadMask(`assets/masks/${sceneId}_walkable_mask.webp`).then(m => {
        if (m) this.masks[`${sceneId}_walkable`] = m;
      });

      // Scene mask
      LoadingTracker.setCurrent(`[bg] ${sceneId} · scene mask`);
      await loadMask(`assets/masks/${sceneId}_mask.webp`).then(m => {
        this.masks[sceneId] = m;
      });

      // Water mask
      LoadingTracker.setCurrent(`[bg] ${sceneId} · water mask`);
      await loadMask(`assets/masks/${sceneId}_water_mask.webp`).then(m => {
        if (m) this.waterMasks[sceneId] = m;
      });

      // Object masks
      if (scene.hotspots) {
        for (const hs of scene.hotspots) {
          if (hs.maskId) {
            LoadingTracker.setCurrent(`[bg] ${sceneId} · mask ${hs.maskId}`);
            await loadMask(`assets/masks/${sceneId}_${hs.maskId}_mask.webp`).then(m => {
              if (m) this.objMasks[`${sceneId}_${hs.maskId}`] = m;
            });
          }
        }
      }

      // 预计算 mask
      this._precomputeMasks([sceneId]);
      this._loadedScenes.add(sceneId);
      console.log(`✅ Background loaded: ${sceneId}`);
    }

    this._allAssetsLoaded = true;
    console.log('✅ All scene assets loaded in background');
  },

  // ── 预计算 mask 边缘、标签、遮罩层 ──
  _precomputeMasks(sceneIds) {
    for (const id of sceneIds) {
      const mask = this.masks[id];
      if (!mask) continue;
      const d = mask.data.data;
      const edges = [];
      for (let y = 1; y < 639; y += 3) {
        for (let x = 1; x < 959; x += 3) {
          if (d[(y * 960 + x) * 4] > 128) {
            if (d[((y) * 960 + x - 3) * 4] <= 128 ||
                d[((y) * 960 + x + 3) * 4] <= 128 ||
                d[((y - 3) * 960 + x) * 4] <= 128 ||
                d[((y + 3) * 960 + x) * 4] <= 128) {
              edges.push(x, y);
            }
          }
        }
      }
      this._edgeCache[id] = edges;

      let sx = 0, sy = 0, cnt = 0;
      for (let y = 0; y < 640; y += 8) {
        for (let x = 0; x < 960; x += 8) {
          if (d[(y * 960 + x) * 4] > 128) { sx += x; sy += y; cnt++; }
        }
      }
      if (cnt > 0) this._labelCache[id] = { x: sx / cnt, y: sy / cnt };

      const oc = document.createElement('canvas');
      oc.width = 960; oc.height = 640;
      const ox = oc.getContext('2d');
      ox.fillStyle = 'rgba(0,255,136,0.12)';
      for (let y = 0; y < 640; y += 3) {
        for (let x = 0; x < 960; x += 3) {
          if (d[(y * 960 + x) * 4] > 128) ox.fillRect(x, y, 3, 3);
        }
      }
      this._overlayCache[id] = oc;
    }

    // 日志
    for (const id of sceneIds) {
      const bgName = SCENES[id].background;
      const frames = (this.bgFrames[bgName] || []).length;
      const chars = SCENES[id].characters?.map(c => c.id).join(', ') || '无';
      console.log(`📦 ${id}: ${frames}帧背景, mask=${!!this.masks[id]}, 角色=${chars}`);
    }
  },

  _edgeCache: {},
  _labelCache: {},
  _overlayCache: {},
  _loadedScenes: new Set(),
  _allAssetsLoaded: false,

  isMaskHit(x, y) {
    const mask = this.masks[this.currentScene];
    if (!mask) return false;
    const px = Math.floor(x), py = Math.floor(y);
    if (px < 0 || px >= 960 || py < 0 || py >= 640) return false;
    return mask.data.data[(py * 960 + px) * 4] > 128;
  },

  start() {
    document.getElementById('title-screen').style.display = 'none';
    this.initAudio();
    this.goScene('apartment');
  },

  renderLoop: null,

  // ── 根据来源场景的出生点映射 ──
  // 格式: { 目标场景: { 来源场景: [归一化x, 归一化y] } }
  // ── 从 walkable mask 随机选取出生点 ──
  getRandomSpawn(sceneId) {
    const maskObj = this.masks[`${sceneId}_walkable`];
    if (!maskObj || !maskObj.data) return [0.5, 0.75];
    const data = maskObj.data.data;  // ImageData.data = Uint8ClampedArray
    const w = maskObj.data.width;
    const h = maskObj.data.height;
    const walkable = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (data[(y * w + x) * 4] > 128) walkable.push([x, y]);
      }
    }
    if (walkable.length === 0) return [0.5, 0.75];
    const [px, py] = walkable[Math.floor(Math.random() * walkable.length)];
    return [
      Math.max(0.02, Math.min(0.98, px / w)),
      Math.max(0.02, Math.min(0.98, py / h))
    ];
  },

  // ── 根据来源场景的出生点映射（已弃用，统一使用随机 walkable 出生点） ──
  SPAWN_MAP: {},

  async goScene(sceneId, fromScene) {
    this._pendingHotspot = null;
    const fade = document.getElementById('fade-overlay');
    fade.classList.add('active');

    // 如果目标场景还没加载完，等待后台加载
    if (!this._loadedScenes.has(sceneId)) {
      console.log(`⏳ Waiting for ${sceneId} assets to load...`);
      await new Promise(resolve => {
        const check = () => {
          if (this._loadedScenes.has(sceneId)) resolve();
          else setTimeout(check, 100);
        };
        check();
      });
    }

    await this.sleep(600);

    // ── 随机出生点：从 walkable mask 中随机选取 ──
    const [sx, sy] = this.getRandomSpawn(sceneId);
    const scene = SCENES[sceneId];
    if (scene && scene.characters && scene.characters[0]) {
      scene.characters[0].x = sx;
      scene.characters[0].y = sy;
    }

    this.currentScene = sceneId;
    this.selectedItem = null;
    this.hideDialogue();

    // 场景滤镜
    const FILTER_MAP = { underground: 'filter-underground', core: 'filter-core' };
    this.canvas.className = FILTER_MAP[sceneId] || '';

    // ── Load real-time lighting for this scene ──
    if (this.useLighting && this.lightingEngine && this.lightingConfig) {
      const sceneConfig = this.lightingConfig.scenes[sceneId];
      if (sceneConfig) {
        try {
          this.lightingEngine.stop();
          await this.lightingEngine.loadScene(sceneId, this.lightingConfig);
          this.lightingEngine.start();
        } catch (err) {
          console.warn(`Lighting load failed for ${sceneId}:`, err);
        }
      } else {
        // No lighting config for this scene — stop engine, fall back to frames
        this.lightingEngine.stop();
        this.lightingEngine.baseTexture = null;
      }
    }

    // 初始化 VFX 引擎
    VFX.init(sceneId);

    // ── 应用场景 UI 主题色 ──
    this._applySceneTheme(sceneId);

    // ── 初始化角色系统 ──
    await CharSystem.initScene(sceneId, this.images);

    this.startRenderLoop();
    this.updateHUD();

    const scene = SCENES[sceneId];
    if (scene && scene.onEnter) {
      await this.sleep(300);
      scene.onEnter();
    }

    fade.classList.remove('active');
  },

  startRenderLoop() {
    if (this.renderLoop) cancelAnimationFrame(this.renderLoop);
    this.lastFrameTime = performance.now();
    this.frameTimer = 0;
    this.currentFrame = 0;
    const loop = (now) => {
      const dt = now - this.lastFrameTime;
      this.lastFrameTime = now;

      // AI 帧序列慢速播放 (~800ms/帧)
      this.frameTimer += dt;
      if (this.frameTimer >= this.frameInterval) {
        this.frameTimer = 0;
        const frames = this.bgFrames[this.currentScene];
        if (frames && frames.length > 1) {
          this.currentFrame = (this.currentFrame + 1) % frames.length;
        }
      }

      this.render(dt);
      this.renderLoop = requestAnimationFrame(loop);
    };
    this.renderLoop = requestAnimationFrame(loop);
  },

  hotspotAnim: 0,

  render(dt) {
    const scene = SCENES[this.currentScene];
    if (!scene) return;

    const bgName = scene.background;

    // ── Render base scene ──
    if (this.useLighting && this.lightingEngine && this.lightingEngine.baseTexture) {
      // Real-time WebGL lighting: engine renders in its own rAF loop,
      // we just copy the result to the game canvas
      this.ctx.drawImage(this.lightingCanvas, 0, 0, 960, 640);
    } else {
      // Fallback: pre-generated frame sequence
      const frames = this.bgFrames[bgName];
      let img;
      if (frames && frames.length > 0) img = frames[this.currentFrame % frames.length];
      if (!img) img = this.images[bgName];
      if (img) {
        this.ctx.drawImage(img, 0, 0, 960, 640);
      } else {
        this.ctx.fillStyle = '#111';
        this.ctx.fillRect(0, 0, 960, 640);
      }
    }

    // ★ 角色渲染 (深度排序) ★
    KeyMove.update(dt);
    CharSystem.update(dt);

    // ── 到达检测：角色停下时触发待执行的交互 ──
    if (this._pendingHotspot) {
      const scene = SCENES[this.currentScene];
      if (scene && scene.characters && scene.characters.length > 0) {
        const playerChar = scene.characters[0];
        const charState = CharSystem.chars[playerChar.id];
        if (charState && !charState.walking) {
          const hs = this._pendingHotspot;
          this._pendingHotspot = null;
          hs.action();
        }
      }
    }

    CharSystem.render(this.ctx);

    // ★ VFX 实时粒子动效叠加 ★
    VFX.render(this.ctx, dt, this.currentScene);

    // ── DEBUG: mask 叠层 + 边缘 + 标签 ──
    if (DebugLogger.enabled) {
      const c = this.ctx;
      const t = performance.now();

      // walkable mask 半透明叠层
      const overlay = this._overlayCache[this.currentScene];
      if (overlay) c.drawImage(overlay, 0, 0);

      // mask 边缘呼吸虚线
      const edges = this._edgeCache[this.currentScene];
      if (edges && edges.length > 0) {
        const breath = 0.4 + 0.6 * Math.abs(Math.sin(t / 600));
        c.save();
        c.strokeStyle = `rgba(0,255,136,${(0.5 + 0.5 * breath).toFixed(2)})`;
        c.lineWidth = 1.2;
        c.setLineDash([6, 4]);
        c.lineDashOffset = -(t / 40) % 10;
        c.beginPath();
        for (let i = 0; i < edges.length; i += 2) {
          const ex = edges[i], ey = edges[i + 1];
          if (i === 0) c.moveTo(ex, ey); else c.lineTo(ex, ey);
        }
        c.stroke();
        c.restore();
      }

      // walkable mask 中心标签
      const labelPos = this._labelCache[this.currentScene];
      if (labelPos) {
        c.save();
        c.font = '11px Courier New';
        c.textAlign = 'center';
        c.fillStyle = 'rgba(0,255,136,0.7)';
        c.fillText('walkable', labelPos.x, labelPos.y);
        c.restore();
      }

      // 对象 mask 叠层 + 边缘 + 标签
      const hs = scene.hotspots;
      if (hs) {
        c.save();
        for (const h of hs) {
          if (!h.maskId) continue;
          const key = `${this.currentScene}_${h.maskId}`;
          const om = this.objMasks[key];
          if (!om) continue;

          // 半透明叠层
          c.globalAlpha = 0.18;
          c.drawImage(om.canvas, 0, 0);
          c.globalAlpha = 1;

          // 对象 mask 边缘
          const od = om.data.data;
          c.strokeStyle = 'rgba(255,200,0,0.7)';
          c.lineWidth = 1;
          c.setLineDash([4, 3]);
          c.lineDashOffset = -(t / 50) % 7;
          c.beginPath();
          for (let y = 1; y < 639; y += 2) {
            for (let x = 1; x < 959; x += 2) {
              if (od[(y * 960 + x) * 4] > 128) {
                if (od[((y) * 960 + x - 2) * 4] <= 128 ||
                    od[((y) * 960 + x + 2) * 4] <= 128 ||
                    od[((y - 2) * 960 + x) * 4] <= 128 ||
                    od[((y + 2) * 960 + x) * 4] <= 128) {
                  c.moveTo(x, y);
                  c.lineTo(x + 1, y);
                }
              }
            }
          }
          c.stroke();

          // 对象标签
          let cx = 0, cy = 0, cn = 0;
          for (let y = 0; y < 640; y += 6) {
            for (let x = 0; x < 960; x += 6) {
              if (od[(y * 960 + x) * 4] > 128) { cx += x; cy += y; cn++; }
            }
          }
          if (cn > 0) {
            cx /= cn; cy /= cn;
            c.font = 'bold 10px Courier New';
            c.textAlign = 'center';
            c.fillStyle = 'rgba(255,200,0,0.85)';
            c.fillText(h.maskId, cx, cy);
          }
        }
        c.restore();
      }
    }

    document.getElementById('scene-name').textContent = scene.name || '';
  },

  handleMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    this.mouseX = (e.clientX - rect.left) * (960 / rect.width);
    this.mouseY = (e.clientY - rect.top) * (640 / rect.height);

    const hotspot = this.getHotspot();
    const hint = document.getElementById('hint-text');

    if (hotspot) {
      this.canvas.style.cursor = 'pointer';
      hint.textContent = hotspot.label || '';
      hint.style.display = 'block';
    } else {
      this.canvas.style.cursor = 'crosshair';
      hint.style.display = 'none';
    }
  },

  handleClick(e) {
    if (this.dialogueActive) return;

    const rect = this.canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (960 / rect.width);
    const y = (e.clientY - rect.top) * (640 / rect.height);

    // ── 角色行走：点击移动 ──
    const scene = SCENES[this.currentScene];
    if (scene && scene.characters && scene.characters.length > 0) {
      // 找到当前场景的玩家角色 (第一个角色)
      const playerChar = scene.characters[0];
      if (playerChar) {
        const nx = x / 960;
        const ny = y / 640;
        if (CharSystem.isWalkable(nx, ny)) {
          CharSystem.moveTo(playerChar.id, nx, ny);
          this._pendingHotspot = null; // 取消待执行的交互
          return; // 行走优先于热点
        }
      }
    }

    const hotspot = this.getHotspotAt(x, y);
    if (hotspot) {
      // 出口类热点：立即执行（不需要走近）
      if (hotspot.isExit) {
        this._pendingHotspot = null;
        hotspot.action();
        return;
      }

      // 交互类热点：角色走过去再交互
      const scene = SCENES[this.currentScene];
      if (scene && scene.characters && scene.characters.length > 0) {
        const playerChar = scene.characters[0];
        if (playerChar) {
          const charState = CharSystem.chars[playerChar.id];
          if (charState && charState.visible) {
            // 计算热点中心点
            let cx, cy;
            if (hotspot.x != null && hotspot.w != null) {
              cx = (hotspot.x + hotspot.w / 2) / 960;
              cy = (hotspot.y + hotspot.h) / 640; // 底部中心（角色站着面对）
            } else if (hotspot.maskId) {
              const key = `${this.currentScene}_${hotspot.maskId}`;
              const objMask = this.objMasks[key];
              if (objMask) {
                cx = charState.x; // fallback 到角色当前位置
                cy = charState.y;
              }
            } else {
              hotspot.action();
              return;
            }

            // 寻找最近的可行走位置
            const walkTarget = this._findWalkableNear(cx, cy, charState.x, charState.y);
            if (walkTarget) {
              this._pendingHotspot = hotspot;
              CharSystem.moveTo(playerChar.id, walkTarget[0], walkTarget[1]);
            } else {
              // 找不到可行走位置，直接执行
              hotspot.action();
            }
            return;
          }
        }
      }

      // 无角色场景：直接执行
      hotspot.action();
    }
  },

  // ── 在目标附近寻找可行走位置 ──
  _findWalkableNear(tx, ty, fallbackX, fallbackY) {
    // 目标本身可行走
    if (CharSystem.isWalkable(tx, ty)) return [tx, ty];
    // 螺旋搜索附近格子
    for (let r = 1; r <= 8; r++) {
      const step = 0.02 * r;
      const candidates = [
        [tx, ty + step],     // 下方
        [tx - step, ty],     // 左
        [tx + step, ty],     // 右
        [tx, ty - step],     // 上
        [tx - step, ty + step],
        [tx + step, ty + step],
        [tx - step, ty - step],
        [tx + step, ty - step],
      ];
      for (const [cx, cy] of candidates) {
        if (cx >= 0 && cx <= 1 && cy >= 0 && cy <= 1 && CharSystem.isWalkable(cx, cy)) {
          return [cx, cy];
        }
      }
    }
    // 全部不可行走，用角色当前位置（不移动）
    if (CharSystem.isWalkable(fallbackX, fallbackY)) return [fallbackX, fallbackY];
    return null;
  },

  getHotspot() {
    return this.getHotspotAt(this.mouseX, this.mouseY);
  },

  getHotspotAt(x, y) {
    const scene = SCENES[this.currentScene];
    if (!scene || !scene.hotspots) return null;

    if (this.masks[this.currentScene]) {
      for (const hs of scene.hotspots) {
        if (hs.condition && !hs.condition()) continue;

        if (hs.maskId) {
          const key = `${this.currentScene}_${hs.maskId}`;
          const objMask = this.objMasks[key];
          if (objMask) {
            const px = Math.floor(x), py = Math.floor(y);
            if (px >= 0 && px < 960 && py >= 0 && py < 640) {
              if (objMask.data.data[(py * 960 + px) * 4] > 128) {
                return hs;
              }
            }
          }
        } else if (hs.isEdge) {
          if (this.isMaskHit(x, y)) return hs;
        }
      }
      return null;
    }

    for (const hs of scene.hotspots) {
      if (hs.condition && !hs.condition()) continue;
      if (x >= hs.x && x <= hs.x + hs.w && y >= hs.y && y <= hs.y + hs.h) {
        return hs;
      }
    }
    return null;
  },

  _buzzApplied: false,

  _applyKeywordBuzz(el) {
    if (this._buzzApplied) return;
    this._buzzApplied = true;

    const raw = el.textContent;
    // 按长度降序排列，优先匹配长词
    const sorted = [...this.KEYWORDS].sort((a, b) => b.length - a.length);
    // 构建正则，转义特殊字符
    const escaped = sorted.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const re = new RegExp(`(${escaped.join('|')})`, 'g');

    const parts = raw.split(re);
    if (parts.length <= 1) return; // 没有命中

    el.innerHTML = '';
    for (const part of parts) {
      if (part && re.test(part)) {
        re.lastIndex = 0;
        const span = document.createElement('span');
        span.className = 'kw-buzz';
        span.textContent = part;
        el.appendChild(span);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    }
    re.lastIndex = 0;
  },

  // ---- 对话系统 ----
  showDialogue(speaker, text, choices, portrait, expression) {
    return new Promise((resolve) => {
      this.dialogueActive = true;
      const box = document.getElementById('dialogue-box');
      const speakerEl = document.getElementById('dialogue-speaker');
      const textEl = document.getElementById('dialogue-text');
      const choicesEl = document.getElementById('dialogue-choices');
      const portraitEl = document.getElementById('dialogue-portrait');
      const portraitCanvas = document.getElementById('dialogue-portrait-canvas');

      // 头像映射：根据角色名自动匹配，也可手动传入 portrait 参数覆盖
      const PORTRAIT_MAP = {
        '凯': 'kai',
        'Oracle': 'oracle',
        '???': 'oracle',
        '谐子': 'joker',
      };
      const charId = portrait || PORTRAIT_MAP[speaker];
      // 如果指定了表情，使用表情变体图；否则用默认头像
      const resolvedPortrait = expression && charId
        ? `portrait_${charId}_${expression}`
        : (charId ? `portrait_${charId}` : null);

      // 有表情 → 静态表情图；谐子无表情 → canvas 动画；其他 → 静态默认图
      if (resolvedPortrait && this.images[resolvedPortrait]) {
        portraitCanvas.classList.remove('visible');
        JokerFace.stop();
        portraitEl.src = this.images[resolvedPortrait].src;
        portraitEl.classList.add('visible');
        portraitEl.classList.remove('joker-glitch');
      } else if (charId === 'joker' && !expression) {
        portraitEl.classList.remove('visible');
        portraitEl.classList.remove('joker-glitch');
        portraitCanvas.classList.add('visible');
        JokerFace.start();
      } else if (resolvedPortrait && this.images[`portrait_${charId}`]) {
        portraitCanvas.classList.remove('visible');
        JokerFace.stop();
        portraitEl.src = this.images[`portrait_${charId}`].src;
        portraitEl.classList.add('visible');
        portraitEl.classList.remove('joker-glitch');
      } else {
        portraitEl.classList.remove('visible');
        portraitEl.classList.remove('joker-glitch');
        portraitCanvas.classList.remove('visible');
        JokerFace.stop();
      }

      let speakerDisplay = speaker || '';

      speakerEl.textContent = speakerDisplay;
      textEl.textContent = '';
      choicesEl.innerHTML = '';
      box.style.display = 'block';

      let i = 0;
      let typing = true;
      this._buzzApplied = false;

      const finishTyping = () => {
        if (!typing) return;
        typing = false;
        clearInterval(typeTimer);
        box.removeEventListener('click', skipHandler);
        textEl.textContent = text;

        // 打字结束后：对关键词施加微震效果
        Game._applyKeywordBuzz(textEl);

        if (choices && choices.length > 0) {
          choices.forEach((c, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = `▸ ${c.text}`;
            btn.onclick = () => {
              this.hideDialogue();
              resolve(idx);
            };
            choicesEl.appendChild(btn);
          });
        } else {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = '▸ 继续...';
          btn.onclick = () => {
            this.hideDialogue();
            resolve(0);
          };
          choicesEl.appendChild(btn);
        }
      };

      // 点击对话框区域 → 跳过打字动画
      const skipHandler = (e) => {
        e.stopPropagation();
        finishTyping();
      };
      box.addEventListener('click', skipHandler);

      const typeTimer = setInterval(() => {
        if (i < text.length) {
          textEl.textContent += text[i];
          i++;
        } else {
          finishTyping();
        }
      }, 25);
    });
  },

  hideDialogue() {
    this.dialogueActive = false;
    document.getElementById('dialogue-box').style.display = 'none';
  },

  // ---- 闲聊对话系统 ----
  // lines: [{ speaker, text, expression? }, ...]
  // expression: 'happy' | 'angry' | 'sad' | 'surprised' | 'thinking' | 'smirk'
  async showCasualChat(lines) {
    for (const line of lines) {

  // ---- 物品系统 ----
  hasItem(id) {
    return this.inventory.includes(id);
  },

  addItem(id) {
    if (!this.hasItem(id)) {
      this.inventory.push(id);
      this.updateInventoryUI();
      this.showHint(`获得物品: ${ITEMS[id].name}`);
    }
  },

  removeItem(id) {
    this.inventory = this.inventory.filter(i => i !== id);
    if (this.selectedItem === id) this.selectedItem = null;
    this.updateInventoryUI();
  },

  // ---- 库存 UI ----
  buildInventoryUI() {
    const bar = document.getElementById('inventory-bar');
    bar.innerHTML = '';
    for (let i = 0; i < 6; i++) {
      const slot = document.createElement('div');
      slot.className = 'inv-slot';
      slot.dataset.index = i;
      slot.onclick = () => this.selectInventorySlot(i);
      bar.appendChild(slot);
    }
    this.updateInventoryUI();
  },

  updateInventoryUI() {
    const slots = document.querySelectorAll('.inv-slot');
    slots.forEach((slot, i) => {
      const itemId = this.inventory[i];
      if (itemId && ITEMS[itemId]) {
        const item = ITEMS[itemId];
        slot.className = 'inv-slot has-item';
        if (this.selectedItem === itemId) slot.classList.add('selected');
        slot.innerHTML = `${item.icon}<div class="inv-tooltip">${item.name}</div>`;
      } else {
        slot.className = 'inv-slot';
        slot.innerHTML = '';
      }
    });
  },

  selectInventorySlot(index) {
    const itemId = this.inventory[index];
    if (itemId) {
      this.selectedItem = this.selectedItem === itemId ? null : itemId;
      this.updateInventoryUI();
    }
  },

  updateHUD() {
    this.updateInventoryUI();
  },

  // ── 场景 UI 主题色 ──
  SCENE_ACCENT: {
    apartment:   { h: 150, s: 100, l: 50 },  // #00ff88 经典绿
    street:      { h: 185, s: 100, l: 50 },  // 霓虹青
    bar:         { h: 310, s: 80, l: 50 },   // 紫红
    alley:       { h: 140, s: 100, l: 60 },  // 浅绿全息
    tower:       { h: 0, s: 80, l: 55 },     // 红色扫描
    server:      { h: 160, s: 100, l: 50 },  // 服务器绿
    rooftop:     { h: 220, s: 100, l: 65 },  // 冷蓝
    underground: { h: 0, s: 85, l: 50 },     // 应急红
    core:        { h: 150, s: 100, l: 50 },  // 核心绿

  _applySceneTheme(sceneId) {
    const accent = this.SCENE_ACCENT[sceneId] || this.SCENE_ACCENT.apartment;
    const { h, s, l } = accent;
    const root = document.documentElement;
    root.style.setProperty('--accent', `hsl(${h}, ${s}%, ${l}%)`);
    root.style.setProperty('--accent-dim', `hsla(${h}, ${s}%, ${l}%, 0.27)`);
    root.style.setProperty('--accent-glow', `hsla(${h}, ${s}%, ${l}%, 0.3)`);
    root.style.setProperty('--accent-bar', `linear-gradient(90deg, hsl(${h}, ${s}%, ${l}%), hsl(${h}, ${s}%, ${Math.max(20, l - 15)}%))`);

    // 更新头像边框颜色 (portrait canvas 和 portrait img)
    const portraits = document.querySelectorAll('#dialogue-portrait, #dialogue-portrait-canvas');
    portraits.forEach(el => {
      el.style.borderColor = `hsl(${h}, ${s}%, ${l}%)`;
      el.style.boxShadow = `0 0 12px hsla(${h}, ${s}%, ${l}%, 0.3)`;
    });
  },

  showHint(text, duration = 2000) {
    const el = document.getElementById('hint-text');
    el.textContent = text;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, duration);
  },

  // ---- 音效 ----
  initAudio() {
    try {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
  },

  playTone(freq, duration = 0.1, type = 'square') {
    if (!this.audioCtx) return;
    const osc = this.audioCtx.createOscillator();
    const gain = this.audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0.05;
    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.audioCtx.destination);
    osc.start();
    osc.stop(this.audioCtx.currentTime + duration);
  },

  sfx(type) {
    switch(type) {
      case 'click': this.playTone(800, 0.05); break;
      case 'pickup': this.playTone(600, 0.1); setTimeout(() => this.playTone(900, 0.1), 100); break;
      case 'door': this.playTone(200, 0.3, 'sawtooth'); break;
      case 'error': this.playTone(200, 0.15); setTimeout(() => this.playTone(150, 0.15), 150); break;
      case 'success': this.playTone(500, 0.1); setTimeout(() => this.playTone(700, 0.1), 100); setTimeout(() => this.playTone(1000, 0.15), 200); break;
    }
  },

  // ---- 结局 ----
  showEnding(title, lines) {
    const screen = document.getElementById('ending-screen');
    document.getElementById('ending-title').textContent = title;
    document.getElementById('ending-text').innerHTML = lines.map(l => `<p>${l}</p>`).join('');
    screen.style.display = 'flex';
  },

  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
};

Game.init();

// ── Lighting Controls ──
// ── 角色键盘移动状态 ──
const KeyMove = {
  keys: {},
  speed: 0.15,  // 归一化坐标/秒

  init() {
    document.addEventListener('keydown', (e) => {
      if (Game.dialogueActive) return;
      const key = e.key.toLowerCase();
      if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
        this.keys[key] = true;
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      this.keys[key] = false;
    });
  },

  update(dt) {
    const scene = SCENES[Game.currentScene];
    if (!scene || !scene.characters || scene.characters.length === 0) return;

    const player = scene.characters[0];
    const char = CharSystem.chars[player.id];
    if (!char || !char.visible) return;

    let dx = 0, dy = 0;
    if (this.keys['w'] || this.keys['arrowup']) dy -= 1;
    if (this.keys['s'] || this.keys['arrowdown']) dy += 1;
    if (this.keys['a'] || this.keys['arrowleft']) dx -= 1;
    if (this.keys['d'] || this.keys['arrowright']) dx += 1;

    if (dx === 0 && dy === 0) {
      // 无按键，如果键盘驱动的行走停止
      if (char._keyWalking) {
        char.walking = false;
        char._keyWalking = false;
        char.targetX = null;
        char.targetY = null;
      }
      return;
    }

    // 键盘移动时取消待执行的交互
    Game._pendingHotspot = null;

    // 归一化方向
    const len = Math.sqrt(dx * dx + dy * dy);
    dx /= len;
    dy /= len;

    const step = this.speed * dt / 1000;
    const nx = char.x + dx * step;
    const ny = char.y + dy * step;

    // 更新朝向
    if (Math.abs(dx) > Math.abs(dy)) {
      char.dir = dx > 0 ? 'right' : 'left';
    } else {
      char.dir = dy > 0 ? 'down' : 'up';
    }

    // 碰撞检测 + 移动
    if (CharSystem.isWalkable(nx, ny)) {
      char.x = nx;
      char.y = ny;
    } else if (CharSystem.isWalkable(nx, char.y)) {
      char.x = nx;
    } else if (CharSystem.isWalkable(char.x, ny)) {
      char.y = ny;
    }

    // 标记为键盘行走中 (触发动画)
    char.walking = true;
    char._keyWalking = true;

    // 边界限制
    char.x = Math.max(0.02, Math.min(0.98, char.x));
    char.y = Math.max(0.1, Math.min(0.98, char.y));
  },
};

document.addEventListener('keydown', (e) => {
  // L key: toggle real-time lighting vs pre-generated frames
  if (e.key === 'l' || e.key === 'L') {
    Game.useLighting = !Game.useLighting;
    const mode = Game.useLighting ? '💡 实时照明' : '🎬 预生成帧';
    console.log(`Lighting mode: ${mode}`);
    // Show brief notification
    const hint = document.getElementById('hint-text');
    if (hint) {
      hint.textContent = `光照模式: ${mode}`;
      hint.style.display = 'block';
      setTimeout(() => { hint.style.display = 'none'; }, 1500);
    }
  }
  // E key: open lighting editor in new tab
  if (e.key === 'e' || e.key === 'E') {
    if (e.ctrlKey || e.metaKey) return; // don't interfere with Ctrl+E
    window.open('lighting-editor.html', '_blank');
  }
});

// 初始化键盘移动
KeyMove.init();
</script>
