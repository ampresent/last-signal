<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST SIGNAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Pixel';
    src: local('Courier New');
  }

  :root {
    --accent: #00ff88;
    --accent-dim: rgba(0, 255, 136, 0.27);
    --accent-glow: rgba(0, 255, 136, 0.3);
    --accent-bar: linear-gradient(90deg, #00ff88, #00cc66);
  }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    color: #c0c0c0;
  }

  #game-container {
    position: relative;
    width: 960px;
    height: 700px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #scene-canvas {
    width: 960px;
    height: 640px;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair;
  }

  /* 对话框 */
  #dialogue-box {
    position: absolute;
    bottom: 60px;
    left: 0;
    right: 0;
    background: rgba(10, 10, 20, 0.95);
    border-top: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent);
    padding: 15px 20px;
    min-height: 120px;
    display: none;
    z-index: 10;
  }

  #dialogue-inner {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  #dialogue-portrait {
    width: 80px;
    height: 80px;
    border: 2px solid var(--accent);
    image-rendering: pixelated;
    flex-shrink: 0;
    display: none;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  #dialogue-portrait-canvas {
    width: 80px;
    height: 80px;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    display: none;
    box-shadow: 0 0 12px var(--accent-glow);
    image-rendering: pixelated;
  }

  #dialogue-portrait-canvas.visible {
    display: block;
  }

  #dialogue-portrait.visible {
    display: block;
  }

  /* 谐子的头像：持续故障变幻 */
  @keyframes portrait-glitch {
    0%, 90%, 100% {
      transform: translate(0, 0);
      filter: none;
    }
    91% {
      transform: translate(-3px, 1px);
      filter: hue-rotate(90deg) saturate(2);
    }
    92% {
      transform: translate(2px, -2px);
      filter: hue-rotate(-60deg) brightness(1.5);
    }
    93% {
      transform: translate(-1px, 2px);
      filter: hue-rotate(180deg) contrast(1.5);
    }
    94% {
      transform: translate(3px, -1px);
      filter: saturate(3) brightness(0.8);
    }
    95% {
      transform: translate(0, 0);
      filter: none;
    }
  }

  @keyframes portrait-scanline {
    0% { background-position: 0 0; }
    100% { background-position: 0 8px; }
  }

  #dialogue-portrait.joker-glitch {
    animation: portrait-glitch 3s ease-in-out infinite;
    position: relative;
  }

  #dialogue-portrait.joker-glitch::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0, 255, 136, 0.05) 3px,
      rgba(0, 255, 136, 0.05) 4px
    );
    animation: portrait-scanline 0.5s linear infinite;
    pointer-events: none;
  }

  #dialogue-body {
    flex: 1;
    min-width: 0;
  }

  #dialogue-speaker {
    color: var(--accent);
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  #dialogue-text {
    color: #e0e0e0;
    font-size: 15px;
    line-height: 1.6;
  }

  /* 关键词微震效果 */
  @keyframes kw-buzz {
    0%, 100% { transform: translate(0, 0); }
    20%      { transform: translate(-0.5px, 0.3px); }
    40%      { transform: translate(0.5px, -0.3px); }
    60%      { transform: translate(-0.3px, -0.5px); }
    80%      { transform: translate(0.3px, 0.5px); }
  }

  .kw-buzz {
    display: inline-block;
    animation: kw-buzz 0.35s ease-in-out 2;
    color: var(--accent);
    text-shadow: 0 0 6px rgba(0, 255, 136, 0.35);
    font-weight: bold;
  }

  #dialogue-choices {
    margin-top: 10px;
  }

  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(0, 255, 136, 0.08);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 8px 15px;
    margin: 4px 0;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.15s;
  }

  .choice-btn:hover {
    background: rgba(0, 255, 136, 0.2);
    border-color: var(--accent);
    padding-left: 20px;
  }

  /* 底部 HUD */
  #hud {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #0a0a14;
    border-top: 1px solid #222;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 10px;
    z-index: 5;
  }

  #inventory-bar {
    display: flex;
    gap: 5px;
    flex: 1;
  }

  .inv-slot {
    width: 44px;
    height: 44px;
    border: 1px solid #333;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .inv-slot.has-item {
    border-color: var(--accent);
    background: rgba(0, 255, 136, 0.05);
  }

  .inv-slot.has-item:hover {
    background: rgba(0, 255, 136, 0.15);
    transform: scale(1.1);
  }

  .inv-slot.selected {
    border-color: #ff6600;
    box-shadow: 0 0 8px #ff660066;
  }

  .inv-tooltip {
    display: none;
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    border: 1px solid var(--accent);
    padding: 5px 10px;
    font-size: 11px;
    white-space: nowrap;
    z-index: 20;
    color: var(--accent);
  }

  .inv-slot:hover .inv-tooltip {
    display: block;
  }

  #scene-name {
    color: #555;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    min-width: 200px;
    text-align: right;
  }

  /* 提示文字 */
  #hint-text {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--accent);
    font-size: 13px;
    background: rgba(0,0,0,0.8);
    padding: 5px 15px;
    border: 1px solid var(--accent-dim);
    z-index: 15;
    display: none;
    text-align: center;
    pointer-events: none;
  }

  /* 标题画面 */
  #title-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #title-screen h1 {
    color: var(--accent);
    font-size: 48px;
    letter-spacing: 12px;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 0 20px var(--accent-dim);
  }

  #title-screen .subtitle {
    color: #555;
    font-size: 13px;
    letter-spacing: 4px;
    margin-bottom: 60px;
  }

  #title-screen .start-btn {
    color: var(--accent);
    font-size: 16px;
    cursor: pointer;
    letter-spacing: 3px;
    animation: blink 1.5s infinite;
    border: 1px solid var(--accent-dim);
    padding: 12px 40px;
    background: none;
    font-family: inherit;
  }

  #title-screen .start-btn:hover {
    background: rgba(0, 255, 136, 0.1);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 加载进度条 */
  #loading-bar-wrap {
    width: 320px;
    height: 6px;
    background: #111;
    border: 1px solid var(--accent-dim);
    border-radius: 3px;
    margin-top: 40px;
    overflow: hidden;
    display: none;
  }

  #loading-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-bar);
    box-shadow: 0 0 8px var(--accent-glow);
    transition: width 0.15s ease-out;
    border-radius: 3px;
  }

  #loading-text {
    color: var(--accent-dim);
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 10px;
    display: none;
  }

  .credits {
    position: absolute;
    bottom: 20px;
    color: #333;
    font-size: 11px;
    letter-spacing: 2px;
  }

  /* 过场 */
  #fade-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s;
  }

  #fade-overlay.active {
    opacity: 1;
  }

  /* 场景滤镜 */
  #scene-canvas.filter-underground {
    filter: brightness(0.55) contrast(1.3) saturate(0.3) sepia(0.4) hue-rotate(-10deg);
  }
  #scene-canvas.filter-core {
    filter: brightness(0.5) contrast(1.4) saturate(0.2) hue-rotate(200deg);
  }

  /* 结局画面 */
  #ending-screen {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    padding: 40px;
  }

  #ending-screen h2 {
    color: var(--accent);
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 30px;
  }

  #ending-screen p {
    color: #aaa;
    font-size: 14px;
    line-height: 2;
    max-width: 600px;
    margin-bottom: 20px;
  }

  #ending-screen .restart-btn {
    color: #555;
    font-size: 13px;
    cursor: pointer;
    margin-top: 30px;
    letter-spacing: 2px;
    background: none;
    border: 1px solid #333;
    padding: 10px 30px;
    font-family: inherit;
  }

  #ending-screen .restart-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene-canvas" width="960" height="640"></canvas>

  <div id="dialogue-box">
    <div id="dialogue-inner">
      <img id="dialogue-portrait" />
      <canvas id="dialogue-portrait-canvas" width="160" height="160"></canvas>
      <div id="dialogue-body">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-choices"></div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="inventory-bar"></div>
    <div id="scene-name"></div>
  </div>

  <div id="hint-text"></div>
  <div id="fade-overlay"></div>

  <div id="title-screen">
    <h1>LAST SIGNAL</h1>
    <div class="subtitle">最 后 的 信 号</div>
    <div id="loading-bar-wrap"><div id="loading-bar-fill"></div></div>
    <div id="loading-text">LOADING ASSETS · 0%</div>
    <div id="debug-panel" style="display:none; position:fixed; top:10px; right:10px; width:420px; max-height:80vh; overflow-y:auto; background:rgba(0,0,0,0.92); border:1px solid #00ff88; color:#c0c0c0; font:11px/1.4 'Courier New',monospace; padding:12px; z-index:9999; border-radius:4px; box-shadow:0 0 20px rgba(0,255,136,0.2);"></div>
    <button class="start-btn" id="start-btn" style="display:none" onclick="Game.start()">▶ 开 始 游 戏</button>
    <div class="credits">A POINT & CLICK ADVENTURE</div>
  </div>

  <div id="ending-screen">
    <h2 id="ending-title"></h2>
    <div id="ending-text"></div>
    <button class="restart-btn" onclick="location.reload()">↺ 重新开始</button>
  </div>
</div>

<script src="lighting-engine.js"></script>
<script>
// ============================================================
// PARTICLE / VFX ENGINE — 实时环境动效系统
// ============================================================
const VFX = {
  // 全局状态
  raindrops: [],        // 雨滴粒子
  splashes: [],         // 雨滴溅起粒子
  fogLayers: [],
  neonPulse: 0,         // 霓虹脉冲相位
  lightFlicker: 1.0,    // 全局亮度闪烁因子
  scanlineOffset: 0,    // CRT 扫描线偏移
  glitchTimer: 0,       // 故障效果计时器
  glitchActive: false,   // 是否正在故障

  // 场景 VFX 配置 — 每个场景定义自己的动效组合
  SCENE_CONFIG: {
    apartment: {
      rain: { count: 60, speed: [3, 6], length: [8, 16], opacity: 0.15, wind: 0.3, clipToMask: 'apartment_window' },
      fog: { layers: 1, speed: 0.15, opacity: 0.06, color: [80, 80, 120] },
      neon: { speed: 0.008, intensity: 0.12 },
      flicker: { enabled: true, chance: 0.003, amount: 0.08 },
      scanlines: { enabled: true, opacity: 0.03 },
      vignette: { inner: 220, outer: 560, opacity: 0.55 },
      particles: { type: 'dust', count: 15, speed: 0.2, opacity: 0.08 },
    },
    street: {
      rain: { count: 200, speed: [5, 10], length: [12, 28], opacity: 0.22, wind: 0.5 },
      fog: { layers: 2, speed: 0.25, opacity: 0.10, color: [60, 70, 110] },
      neon: { speed: 0.012, intensity: 0.18 },
      flicker: { enabled: true, chance: 0.008, amount: 0.12 },
      scanlines: { enabled: false },
      vignette: { inner: 200, outer: 580, opacity: 0.5 },
      puddleReflection: { enabled: true, y: 500, opacity: 0.12,
        specular: [[150, 540, 0.2, [255,80,180]], [480, 560, 0.15, [100,200,255]], [750, 545, 0.18, [80,255,200]]],
        rippleChance: 0.003, reflectStrength: 0.12 },
      particles: { type: 'steam', count: 8, speed: 0.4, opacity: 0.06 },
    },
    bar: {
      rain: { count: 0 },
      fog: { layers: 1, speed: 0.08, opacity: 0.08, color: [90, 40, 80] },
      neon: { speed: 0.015, intensity: 0.22 },
      flicker: { enabled: true, chance: 0.01, amount: 0.15 },
      scanlines: { enabled: true, opacity: 0.02 },
      vignette: { inner: 180, outer: 500, opacity: 0.6 },
      particles: { type: 'smoke', count: 12, speed: 0.15, opacity: 0.10 },
    },
    alley: {
      rain: { count: 120, speed: [4, 8], length: [10, 22], opacity: 0.20, wind: 0.6 },
      fog: { layers: 1, speed: 0.10, opacity: 0.12, color: [50, 50, 70] },
      neon: { speed: 0.020, intensity: 0.15 },
      flicker: { enabled: true, chance: 0.015, amount: 0.20 },
      scanlines: { enabled: false },
      vignette: { inner: 150, outer: 480, opacity: 0.65 },
      particles: { type: 'drip', count: 5, speed: 1.5, opacity: 0.12 },
      puddleReflection: { enabled: true, y: 520, opacity: 0.10,
        specular: [[400, 560, 0.15, [50,230,80]], [150, 545, 0.10, [230,50,60]]],
        rippleChance: 0.004, reflectStrength: 0.10 },
    },
    tower: {
      rain: { count: 160, speed: [5, 9], length: [14, 26], opacity: 0.20, wind: 0.4 },
      fog: { layers: 2, speed: 0.20, opacity: 0.08, color: [50, 60, 100] },
      neon: { speed: 0.006, intensity: 0.08 },
      flicker: { enabled: true, chance: 0.005, amount: 0.10 },
      scanlines: { enabled: false },
      vignette: { inner: 250, outer: 600, opacity: 0.45 },
      particles: { type: 'dust', count: 10, speed: 0.3, opacity: 0.05 },
      puddleReflection: { enabled: true, y: 530, opacity: 0.08,
        specular: [[480, 570, 0.12, [180,200,255]]],
        rippleChance: 0.002, reflectStrength: 0.08 },
    },
    server: {
      rain: { count: 0 },
      fog: { layers: 0 },
      neon: { speed: 0.005, intensity: 0.06 },
      flicker: { enabled: true, chance: 0.02, amount: 0.18 },
      scanlines: { enabled: true, opacity: 0.04 },
      vignette: { inner: 200, outer: 520, opacity: 0.5 },
      particles: { type: 'data', count: 20, speed: 0.5, opacity: 0.10 },
    },
    rooftop: {
      rain: { count: 250, speed: [6, 12], length: [15, 32], opacity: 0.25, wind: 0.7 },
      fog: { layers: 3, speed: 0.35, opacity: 0.14, color: [70, 80, 120] },
      neon: { speed: 0.010, intensity: 0.10 },
      flicker: { enabled: false },
      scanlines: { enabled: false },
      vignette: { inner: 280, outer: 600, opacity: 0.4 },
      particles: { type: 'wind', count: 10, speed: 1.0, opacity: 0.04 },
      puddleReflection: { enabled: true, y: 510, opacity: 0.10,
        specular: [[300, 550, 0.15, [100,180,255]], [660, 540, 0.12, [255,120,60]]],
        rippleChance: 0.004, reflectStrength: 0.10 },
    },
    office: {
      rain: { count: 40, speed: [3, 5], length: [8, 14], opacity: 0.12, wind: 0.2 },
      fog: { layers: 1, speed: 0.10, opacity: 0.05, color: [100, 100, 130] },
      neon: { speed: 0.006, intensity: 0.10 },
      flicker: { enabled: true, chance: 0.004, amount: 0.06 },
      scanlines: { enabled: true, opacity: 0.02 },
      vignette: { inner: 200, outer: 540, opacity: 0.5 },
      particles: { type: 'dust', count: 12, speed: 0.15, opacity: 0.06 },
    },
    underground: {
      rain: { count: 0 },
      fog: { layers: 1, speed: 0.06, opacity: 0.10, color: [80, 30, 30] },
      neon: { speed: 0.018, intensity: 0.20 },
      flicker: { enabled: true, chance: 0.025, amount: 0.22 },
      scanlines: { enabled: true, opacity: 0.05 },
      vignette: { inner: 170, outer: 480, opacity: 0.65 },
      particles: { type: 'data', count: 30, speed: 0.6, opacity: 0.12 },
    },
    core: {
      rain: { count: 0 },
      fog: { layers: 0 },
      neon: { speed: 0.025, intensity: 0.30 },
      flicker: { enabled: true, chance: 0.035, amount: 0.25 },
      scanlines: { enabled: true, opacity: 0.06 },
      vignette: { inner: 140, outer: 450, opacity: 0.7 },
      particles: { type: 'data', count: 50, speed: 0.8, opacity: 0.15 },
    },
  },

  // 通用粒子池
  particles: [],

  // ---- 初始化场景 VFX ----
  init(sceneId) {
    const cfg = this.SCENE_CONFIG[sceneId] || this.SCENE_CONFIG.apartment;
    this.raindrops = [];
    this.splashes = [];
    this.fogLayers = [];
    this.particles = [];

    // 初始化雨滴
    if (cfg.rain && cfg.rain.count > 0) {
      for (let i = 0; i < cfg.rain.count; i++) {
        this.raindrops.push(this._newRaindrop(cfg.rain));
      }
    }

    // 初始化雾气层
    if (cfg.fog && cfg.fog.layers > 0) {
      for (let i = 0; i < cfg.fog.layers; i++) {
        this.fogLayers.push({
          x: Math.random() * 960,
          y: 100 + Math.random() * 300,
          w: 300 + Math.random() * 500,
          h: 80 + Math.random() * 120,
          speed: cfg.fog.speed * (0.5 + Math.random()),
          opacity: cfg.fog.opacity * (0.5 + Math.random() * 0.5),
          color: cfg.fog.color,
        });
      }
    }

    // 初始化环境粒子
    if (cfg.particles && cfg.particles.count > 0) {
      for (let i = 0; i < cfg.particles.count; i++) {
        this.particles.push(this._newParticle(cfg.particles));
      }
    }

    this.neonPulse = Math.random() * Math.PI * 2;
    this.lightFlicker = 1.0;
    this.glitchActive = false;
    this.glitchTimer = 0;
  },

  _newRaindrop(rcfg) {
    const speed = rcfg.speed[0] + Math.random() * (rcfg.speed[1] - rcfg.speed[0]);
    const wind = rcfg.wind || 0;
    // 倾角：从竖直方向偏转，基于风速 + 小范围随机抖动 (±8°)
    const baseAngle = Math.atan2(wind, speed);
    const jitter = (Math.random() - 0.5) * (16 * Math.PI / 180); // ±8°
    const tiltAngle = baseAngle + jitter;
    return {
      x: Math.random() * 1000 - 20,
      y: Math.random() * 680 - 40,
      speed: speed,
      length: rcfg.length[0] + Math.random() * (rcfg.length[1] - rcfg.length[0]),
      opacity: 0.3 + Math.random() * 0.7,
      wind: wind,
      tiltAngle: tiltAngle,
      // 每个雨滴独立的随机参数，打破规则感
      windOffset: (Math.random() - 0.5) * 0.6,        // 风向随机偏移 ±0.3
      turbulencePhase: Math.random() * Math.PI * 2,    // 湍流相位
      turbulenceAmp: 0.15 + Math.random() * 0.35,      // 湍流幅度
      speedVariation: (Math.random() - 0.5) * 0.4,     // 速度微扰
      thickness: 0.6 + Math.random() * 0.8,            // 粗细变化
      splashCooldown: 0,                                // 硬表面溅起冷却 (ms)
    };
  },

  _newParticle(pcfg) {
    const p = {
      x: Math.random() * 960,
      y: Math.random() * 640,
      vx: (Math.random() - 0.5) * pcfg.speed,
      vy: -Math.random() * pcfg.speed * 0.5,
      life: Math.random(),
      maxLife: 2 + Math.random() * 4,
      age: 0,
      size: 1 + Math.random() * 3,
      opacity: pcfg.opacity * (0.3 + Math.random() * 0.7),
      type: pcfg.type,
    };
    // 根据类型微调
    if (pcfg.type === 'steam') {
      p.vy = -0.3 - Math.random() * 0.5;
      p.vx = (Math.random() - 0.5) * 0.8;
      p.size = 3 + Math.random() * 6;
      p.y = 500 + Math.random() * 140;
    } else if (pcfg.type === 'smoke') {
      p.vy = -0.1 - Math.random() * 0.2;
      p.vx = 0.1 + Math.random() * 0.3;
      p.size = 8 + Math.random() * 15;
    } else if (pcfg.type === 'drip') {
      p.vy = 1.0 + Math.random() * 2.0;
      p.vx = 0;
      p.y = Math.random() * 200;
    } else if (pcfg.type === 'data') {
      p.vy = 0.5 + Math.random() * 1.5;
      p.vx = 0;
      p.x = Math.random() * 960;
      p.y = -10;
      p.size = 1;
    } else if (pcfg.type === 'wind') {
      p.vx = 1.5 + Math.random() * 2.0;
      p.vy = -0.2 + Math.random() * 0.4;
      p.y = Math.random() * 640;
      p.x = -20;
      p.size = 1 + Math.random() * 2;
    }
    return p;
  },

  // ---- 主渲染入口 ----
  render(ctx, dt, sceneId) {
    const cfg = this.SCENE_CONFIG[sceneId];
    if (!cfg) return;

    // 1. 雨滴
    if (cfg.rain && cfg.rain.count > 0) {
      this._renderRain(ctx, dt, cfg.rain);
    }

    // 1.5 雨滴溅起效果
    if (this.splashes.length > 0) {
      this._renderSplashes(ctx, dt);
    }

    // 2. 雾气
    if (cfg.fog && cfg.fog.layers > 0) {
      this._renderFog(ctx, dt, cfg.fog);
    }

    // 3. 霓虹脉冲 (叠加在背景上的色相微偏移)
    if (cfg.neon) {
      this._renderNeonPulse(ctx, dt, cfg.neon);
    }

    // 4. 环境粒子
    if (cfg.particles && cfg.particles.count > 0) {
      this._renderParticles(ctx, dt, cfg.particles);
    }

    // 5. 水洼反射
    if (cfg.puddleReflection && cfg.puddleReflection.enabled) {
      this._renderPuddleReflection(ctx, dt, cfg.puddleReflection);
    }

    // 6. 暗角
    if (cfg.vignette) {
      this._renderVignette(ctx, cfg.vignette);
    }

    // 7. 全局亮度闪烁
    if (cfg.flicker && cfg.flicker.enabled) {
      this._applyFlicker(ctx, dt, cfg.flicker);
    }

    // 8. CRT 扫描线
    if (cfg.scanlines && cfg.scanlines.enabled) {
      this._renderScanlines(ctx, cfg.scanlines);
    }

    // 9. 偶发故障效果
    this._maybeGlitch(ctx, dt);
  },

  // ---- 雨滴渲染 ----
  _renderRain(ctx, dt, rcfg) {
    // 更新雨滴位置 + 碰撞检测
    const waterMask = Game.waterMasks[Game.currentScene];
    const dtSec = dt / 1000;
    for (const drop of this.raindrops) {
      // 速度带微扰，模拟不同大小雨滴
      const effectiveSpeed = drop.speed + drop.speedVariation * drop.speed * 0.3;
      drop.y += effectiveSpeed;
      // 独立风偏移 + 微弱湍流摆动
      const turbX = Math.sin(drop.y * 0.04 + drop.turbulencePhase) * drop.turbulenceAmp;
      drop.x += drop.wind + drop.windOffset + turbX * 0.3;

      let splashed = false;
      let hardSurfaceHit = false;

      // 1. 先检查是否落在 water mask 上
      if (waterMask) {
        const px = Math.floor(drop.x);
        const py = Math.floor(drop.y);
        if (px >= 0 && px < 960 && py >= 0 && py < 640) {
          if (waterMask.data.data[(py * 960 + px) * 4] > 128) {
            this._spawnWaterRipple(drop.x, drop.y, rcfg);
            splashed = true;
          }
        }
      }

      // 2. 硬表面碰撞：深度差检测 — 溅起但继续下落
      if (!splashed && CharSystem && CharSystem.depthData) {
        // 冷却期内跳过碰撞，防止同一表面反复溅起
        if (drop.splashCooldown > 0) {
          drop.splashCooldown -= dt;
        } else {
          const nx = drop.x / 960;
          const ny = drop.y / 640;
          if (nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1) {
            const depthHere = CharSystem.getDepth(nx, ny);
            const nyAbove = (drop.y - 6) / 640;
            const depthAbove = nyAbove >= 0 ? CharSystem.getDepth(nx, nyAbove) : depthHere;
            if (depthHere - depthAbove > 0.06) {
              this._spawnSplash(drop.x, drop.y, drop.wind + drop.windOffset, rcfg);
              hardSurfaceHit = true;
              drop.splashCooldown = 200; // 200ms 冷却，让雨滴穿过表面
            }
          }
        }
      }

      // 水面碰撞才重置到顶部；硬表面碰撞只溅起，雨滴继续往下
      if (splashed || drop.y > 660) {
        drop.y = -drop.length - Math.random() * 40;
        drop.x = Math.random() * 1000 - 20;
        // 重置湍流相位，避免模式重复
        drop.turbulencePhase = Math.random() * Math.PI * 2;
      }
      if (drop.x > 980) drop.x = -20;
    }

    ctx.save();

    if (rcfg.clipToMask && Game.objMasks && Game.objMasks[rcfg.clipToMask]) {
      // 室内：雨滴只在窗口 mask 区域显示
      if (!this._rainCanvas) {
        this._rainCanvas = document.createElement('canvas');
        this._rainCanvas.width = 960;
        this._rainCanvas.height = 640;
      }
      const rc = this._rainCanvas.getContext('2d');
      rc.clearRect(0, 0, 960, 640);

      // 在临时 canvas 上画雨丝 — 用贝塞尔曲线模拟自然弯曲
      rc.lineWidth = 1;
      for (const drop of this.raindrops) {
        // 倾角决定雨丝方向，湍流只叠加微弱弯曲
        const dx = Math.sin(drop.tiltAngle) * drop.length;
        const dy = Math.cos(drop.tiltAngle) * drop.length;
        const endX = drop.x + dx;
        const endY = drop.y + dy;
        const midX = drop.x + dx * 0.5;
        const midY = drop.y + dy * 0.5;
        // 湍流弯曲控制点
        const turb = Math.sin(drop.y * 0.03 + drop.turbulencePhase) * drop.turbulenceAmp * 2;
        const alpha = rcfg.opacity * drop.opacity * drop.thickness;
        rc.strokeStyle = `rgba(180, 200, 255, ${alpha})`;
        rc.lineWidth = drop.thickness;
        rc.beginPath();
        rc.moveTo(drop.x, drop.y);
        rc.quadraticCurveTo(midX + turb, midY, endX + turb * 0.5, endY);
        rc.stroke();
      }

      // destination-in：只保留 mask 区域内的像素
      rc.globalCompositeOperation = 'destination-in';
      rc.drawImage(Game.objMasks[rcfg.clipToMask].canvas, 0, 0, 960, 640);

      // 画到主 canvas（正常叠加，不破坏背景）
      ctx.drawImage(this._rainCanvas, 0, 0);
    } else {
      // 室外：全屏雨丝 — 贝塞尔曲线 + 湍流
      for (const drop of this.raindrops) {
        // 倾角决定雨丝方向，湍流只叠加微弱弯曲
        const dx = Math.sin(drop.tiltAngle) * drop.length;
        const dy = Math.cos(drop.tiltAngle) * drop.length;
        const endX = drop.x + dx;
        const endY = drop.y + dy;
        const midX = drop.x + dx * 0.5;
        const midY = drop.y + dy * 0.5;
        const turb = Math.sin(drop.y * 0.03 + drop.turbulencePhase) * drop.turbulenceAmp * 2;
        const alpha = rcfg.opacity * drop.opacity * drop.thickness;
        ctx.strokeStyle = `rgba(180, 200, 255, ${alpha})`;
        ctx.lineWidth = drop.thickness;
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.quadraticCurveTo(midX + turb, midY, endX + turb * 0.5, endY);
        ctx.stroke();
      }
    }

    ctx.restore();
  },

  // ---- 生成溅起粒子 ----
  _spawnSplash(x, y, wind, rcfg) {
    const count = 3 + Math.floor(Math.random() * 3); // 3~5 个溅射粒子
    const baseOpacity = (rcfg.opacity || 0.2) * 2.5;
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI * 0.15 + Math.random() * (-Math.PI * 0.7); // 向上偏 15°~85°
      const speed = 1.2 + Math.random() * 2.5;
      this.splashes.push({
        x: x + (Math.random() - 0.5) * 4,
        y: y,
        vx: Math.cos(angle) * speed * (Math.random() > 0.5 ? 1 : -0.6) + wind * 0.3,
        vy: Math.sin(angle) * speed,
        life: 0,
        maxLife: 0.25 + Math.random() * 0.2, // 250~450ms 短暂存在
        size: 0.8 + Math.random() * 1.5,
        opacity: baseOpacity * (0.5 + Math.random() * 0.5),
      });
    }
  },

  // ---- 渲染溅起粒子 + 水面涟漪 ----
  _renderSplashes(ctx, dt) {
    if (this.splashes.length === 0) return;
    ctx.save();
    for (let i = this.splashes.length - 1; i >= 0; i--) {
      const s = this.splashes[i];
      s.life += dt / 1000;

      const t = s.life / s.maxLife;
      if (t >= 1) {
        this.splashes.splice(i, 1);
        continue;
      }

      if (s.isRipple) {
        // 水面涟漪渲染：同心圆扩散
        const radius = s.size + s.growRate * s.life;
        // 前 20% 淡入，后 50% 淡出
        const alpha = t < 0.2 ? s.opacity * (t / 0.2)
                    : t > 0.5 ? s.opacity * (1 - (t - 0.5) / 0.5)
                    : s.opacity;

        ctx.lineWidth = 1.0;
        for (let r = 0; r < s.rings; r++) {
          const ringRadius = radius * (1 - r * 0.25);
          const ringAlpha = alpha * (1 - r * 0.3);
          if (ringRadius <= 0 || ringAlpha <= 0) continue;
          ctx.strokeStyle = `rgba(140, 200, 255, ${ringAlpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, ringRadius, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else {
        // 硬表面溅射粒子
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.18; // 重力

        // 淡出曲线：前 30% 保持，后 70% 线性淡出
        const alpha = t < 0.3 ? s.opacity : s.opacity * (1 - (t - 0.3) / 0.7);

        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(180, 210, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * (1 - t * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  // ---- 生成水面涟漪（雨滴落入水面） ----
  _spawnWaterRipple(x, y, rcfg) {
    // 水面涟漪：同心圆扩散效果
    const baseOpacity = (rcfg.opacity || 0.2) * 2.0;
    this.splashes.push({
      x: x,
      y: y,
      vx: 0,
      vy: 0,
      life: 0,
      maxLife: 0.6 + Math.random() * 0.3, // 600~900ms 扩散
      size: 2 + Math.random() * 2,         // 初始半径
      growRate: 18 + Math.random() * 10,    // 扩散速度 px/s
      opacity: baseOpacity * (0.4 + Math.random() * 0.3),
      isRipple: true,  // 标记为涟漪而非溅射
      rings: 2 + Math.floor(Math.random() * 2), // 2~3 圈涟漪
    });
  },

  _rainCanvas: null,

  // ---- 雾气渲染 ----
  _renderFog(ctx, dt, fcfg) {
    ctx.save();
    for (const fog of this.fogLayers) {
      fog.x += fog.speed;
      if (fog.x > 960 + fog.w) fog.x = -fog.w;

      const grad = ctx.createRadialGradient(
        fog.x + fog.w / 2, fog.y + fog.h / 2, 0,
        fog.x + fog.w / 2, fog.y + fog.h / 2, fog.w / 2
      );
      const [r, g, b] = fog.color;
      grad.addColorStop(0, `rgba(${r},${g},${b},${fog.opacity})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

      ctx.fillStyle = grad;
      ctx.fillRect(fog.x, fog.y, fog.w, fog.h);
    }
    ctx.restore();
  },

  // ---- 霓虹脉冲 ----
  _renderNeonPulse(ctx, dt, ncfg) {
    this.neonPulse += ncfg.speed;
    const pulse = Math.sin(this.neonPulse) * 0.5 + 0.5;
    const alpha = ncfg.intensity * pulse;

    // 在背景上叠加一层极淡的绿色/紫色色偏
    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // 绿色霓虹光晕（散布在画面上半部）
    const grad1 = ctx.createRadialGradient(300, 200, 0, 300, 200, 250);
    grad1.addColorStop(0, `rgba(0, 255, 136, ${alpha * 0.4})`);
    grad1.addColorStop(1, 'rgba(0, 255, 136, 0)');
    ctx.fillStyle = grad1;
    ctx.fillRect(0, 0, 960, 640);

    // 紫色霓虹光晕
    const grad2 = ctx.createRadialGradient(700, 150, 0, 700, 150, 200);
    grad2.addColorStop(0, `rgba(180, 0, 255, ${alpha * 0.3})`);
    grad2.addColorStop(1, 'rgba(180, 0, 255, 0)');
    ctx.fillStyle = grad2;
    ctx.fillRect(0, 0, 960, 640);

    ctx.restore();
  },

  // ---- 环境粒子 ----
  _renderParticles(ctx, dt, pcfg) {
    ctx.save();
    for (const p of this.particles) {
      p.age += dt / 1000;
      p.x += p.vx;
      p.y += p.vy;

      // 生命周期
      let alpha;
      if (p.age < p.maxLife * 0.2) {
        alpha = p.opacity * (p.age / (p.maxLife * 0.2));
      } else if (p.age > p.maxLife * 0.7) {
        alpha = p.opacity * (1 - (p.age - p.maxLife * 0.7) / (p.maxLife * 0.3));
      } else {
        alpha = p.opacity;
      }

      if (p.age >= p.maxLife || p.y < -20 || p.y > 660 || p.x < -20 || p.x > 980) {
        Object.assign(p, this._newParticle(pcfg));
        p.age = 0;
        continue;
      }

      ctx.globalAlpha = alpha;
      if (p.type === 'data') {
        // 数据流粒子：绿色小方块
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(p.x, p.y, 2, 2);
      } else if (p.type === 'steam') {
        // 蒸汽：灰色半透明圆
        ctx.fillStyle = 'rgba(160, 170, 190, 0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'smoke') {
        // 烟雾：紫灰色大圆
        ctx.fillStyle = 'rgba(120, 80, 140, 0.3)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'drip') {
        // 水滴：蓝色小点
        ctx.fillStyle = 'rgba(140, 180, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'wind') {
        // 风尘：灰白色线条
        ctx.strokeStyle = 'rgba(200, 200, 220, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 8, p.y - p.vy * 4);
        ctx.stroke();
      } else {
        // 灰尘：黄色小点
        ctx.fillStyle = 'rgba(200, 180, 120, 0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },

  // ---- 水面反射 (增强版) ----
  // 反射场景内容 + 波纹扰动 + 镜面高光 + 涟漪
  // 使用统一 mask 体系中的 water mask 识别水面
  _renderPuddleReflection(ctx, dt, pcfg) {
    const W = 960, H = 640;
    const sceneId = Game.currentScene;

    // 从 water mask 获取水面区域，无 mask 则用配置值
    let waterY = pcfg.y;
    let waterH = H - waterY;
    const waterMask = Game.waterMasks[sceneId];

    if (waterMask) {
      // 扫描 water mask 找到水面的最顶部 Y（第一个白色行）
      const d = waterMask.data.data;
      let topY = H, bottomY = 0;
      for (let y = 0; y < H; y += 2) {
        for (let x = 0; x < W; x += 8) {
          if (d[(y * W + x) * 4] > 128) {
            if (y < topY) topY = y;
            if (y > bottomY) bottomY = y;
            break;
          }
        }
      }
      if (topY < H) {
        waterY = topY;
        waterH = bottomY - topY;
      }
    }

    if (waterH <= 0) return;

    // ── 初始化持久状态 ──
    if (!this._waterState) {
      this._waterState = {
        ripples: [],       // 活跃涟漪 [{x, y, age, maxAge}]
        wavePhase: 0,      // 波浪相位
        shimmer: 0,        // 闪烁计时
      };
    }
    const ws = this._waterState;
    ws.wavePhase += dt * 0.002;
    ws.shimmer += dt * 0.003;

    ctx.save();

    // ══════════════════════════════════════════════════
    // 1. 场景反射 — 捕获水面以上的画面，垂直翻转后绘制到水面
    // ══════════════════════════════════════════════════
    const reflectStrength = pcfg.reflectStrength || 0.35;
    if (reflectStrength > 0.05) {
      try {
        // 捕获水面以上的区域
        const srcH = Math.min(waterY, 300); // 最多反射 300px 高
        const srcY = waterY - srcH;
        const imgData = ctx.getImageData(0, srcY, W, srcH);

        // 创建临时 canvas 做反射
        if (!this._reflectCanvas) {
          this._reflectCanvas = document.createElement('canvas');
          this._reflectCtx = this._reflectCanvas.getContext('2d');
        }
        const rc = this._reflectCanvas;
        const rctx = this._reflectCtx;
        rc.width = W;
        rc.height = srcH;

        // 垂直翻转：手动翻转像素数据 (putImageData 忽略 canvas transform)
        const flipped = new Uint8ClampedArray(imgData.data.length);
        for (let row = 0; row < srcH; row++) {
          const srcRow = srcH - 1 - row; // 从底部往上读 → 翻转
          for (let col = 0; col < W; col++) {
            const dstIdx = (row * W + col) * 4;
            const srcIdx = (srcRow * W + col) * 4;
            flipped[dstIdx]     = imgData.data[srcIdx];
            flipped[dstIdx + 1] = imgData.data[srcIdx + 1];
            flipped[dstIdx + 2] = imgData.data[srcIdx + 2];
            flipped[dstIdx + 3] = imgData.data[srcIdx + 3];
          }
        }
        const flippedImg = new ImageData(flipped, W, srcH);
        rctx.putImageData(flippedImg, 0, 0);

        // 波纹扰动：逐列水平偏移模拟积水微澜
        const waveData = rctx.getImageData(0, 0, W, srcH);
        const pixels = waveData.data;
        const distorted = new Uint8ClampedArray(pixels);
        const time = ws.wavePhase;

        for (let row = 0; row < srcH; row++) {
          // 越靠近水面顶部扰动越大，底部衰减
          const depthFade = 1.0 - (row / srcH) * 0.6;
          // 积水：极微弱的扰动，只有 ~1px 级别
          const wave1 = Math.sin(row * 0.06 + time * 1.2) * 0.8 * depthFade;
          const wave2 = Math.sin(row * 0.12 + time * 0.9 + 1.3) * 0.4 * depthFade;
          const shift = Math.round(wave1 + wave2);

          for (let col = 0; col < W; col++) {
            let srcCol = col + shift;
            srcCol = Math.max(0, Math.min(W - 1, srcCol));

            const dstIdx = (row * W + col) * 4;
            const srcIdx = (row * W + srcCol) * 4;
            distorted[dstIdx]     = pixels[srcIdx];
            distorted[dstIdx + 1] = pixels[srcIdx + 1];
            distorted[dstIdx + 2] = pixels[srcIdx + 2];
            distorted[dstIdx + 3] = pixels[srcIdx + 3];
          }
        }

        // 写回临时 canvas
        const distImg = new ImageData(distorted, W, srcH);
        rctx.putImageData(distImg, 0, 0);

        // 绘制反射到主 canvas，带透明度 + 蓝色调
        ctx.globalAlpha = reflectStrength;
        ctx.drawImage(rc, 0, waterY, W, Math.min(waterH, srcH));

        // 蓝色水面色调叠加（积水很淡）
        ctx.globalAlpha = 0.06;
        ctx.fillStyle = '#0a2a3d';
        ctx.fillRect(0, waterY, W, waterH);

        ctx.globalAlpha = 1.0;
      } catch(e) {
        // getImageData 可能因 CORS 失败，静默降级
      }
    }

    // ══════════════════════════════════════════════════
    // 2. 水面渐变底色（积水：极淡蓝灰）
    // ══════════════════════════════════════════════════
    const grad = ctx.createLinearGradient(0, waterY, 0, H);
    grad.addColorStop(0, `rgba(10, 50, 70, ${pcfg.opacity * 0.3})`);
    grad.addColorStop(0.3, `rgba(5, 40, 60, ${pcfg.opacity * 0.18})`);
    grad.addColorStop(1, `rgba(0, 25, 40, ${pcfg.opacity * 0.06})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, waterY, W, waterH);

    // ══════════════════════════════════════════════════
    // 3. 波纹线（积水极微弱涟漪纹理）
    // ══════════════════════════════════════════════════
    const time = ws.wavePhase;
    ctx.lineWidth = 0.4;
    for (let i = 0; i < 3; i++) {
      const baseY = waterY + 8 + i * (waterH / 4);
      const amp = 0.5 + Math.sin(time * 0.6 + i * 1.1) * 0.3;
      const alpha = pcfg.opacity * (0.06 + 0.03 * Math.sin(time * 0.7 + i));
      ctx.strokeStyle = `rgba(80, 180, 220, ${alpha})`;
      ctx.beginPath();
      for (let x = 0; x < W; x += 4) {
        const dy = Math.sin(x * 0.01 + time * 0.8 + i * 0.7) * amp
                 + Math.sin(x * 0.02 + time * 1.1 + i * 1.3) * amp * 0.3;
        if (x === 0) ctx.moveTo(x, baseY + dy);
        else ctx.lineTo(x, baseY + dy);
      }
      ctx.stroke();
    }

    // ══════════════════════════════════════════════════
    // 4. 镜面高光 — 模拟光源在水面的反射光斑
    // ══════════════════════════════════════════════════
    const speculars = pcfg.specular || [];
    for (const spec of speculars) {
      const [sx, sy, intensity, color] = spec;
      // 呼吸闪烁
      const flicker = 0.5 + 0.5 * Math.sin(ws.shimmer * (1.5 + sx * 0.003) + sx * 0.01);
      const alpha = pcfg.opacity * intensity * flicker;

      // 椭圆形光斑 — 积水反射很小
      const rx = 12 + 5 * Math.sin(time + sx);
      const ry = 3 + 1.5 * Math.sin(time * 1.3 + sy);
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, rx);
      grad.addColorStop(0, `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha * 0.6})`);
      grad.addColorStop(0.5, `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha * 0.2})`);
      grad.addColorStop(1, `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(sx, sy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // 高光中心亮点
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
      ctx.beginPath();
      ctx.ellipse(sx, sy, rx * 0.15, ry * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ══════════════════════════════════════════════════
    // 5. 涟漪 — 随机生成的同心圆波纹
    // ══════════════════════════════════════════════════
    // 生成新涟漪
    if (Math.random() < (pcfg.rippleChance || 0.005)) {
      ws.ripples.push({
        x: 100 + Math.random() * (W - 200),
        y: waterY + 15 + Math.random() * (waterH - 30),
        age: 0,
        maxAge: 2000 + Math.random() * 1500,
      });
    }

    // 渲染 + 老化涟漪
    ctx.lineWidth = 0.7;
    ws.ripples = ws.ripples.filter(r => {
      r.age += dt;
      if (r.age > r.maxAge) return false;

      const progress = r.age / r.maxAge; // 0→1
      const radius = 4 + progress * 18;  // 积水涟漪很小
      const alpha = pcfg.opacity * 0.18 * (1.0 - progress) * (1.0 - progress);

      ctx.strokeStyle = `rgba(120, 200, 240, ${alpha})`;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, radius, radius * 0.25, 0, 0, Math.PI * 2);
      ctx.stroke();

      // 内圈（仅在半径足够时显示）
      if (radius > 10) {
        ctx.strokeStyle = `rgba(150, 220, 255, ${alpha * 0.4})`;
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, radius * 0.5, radius * 0.12, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      return true;
    });

    ctx.restore();
  },

  // ---- 暗角 ----
  _renderVignette(ctx, vcfg) {
    const grad = ctx.createRadialGradient(480, 320, vcfg.inner, 480, 320, vcfg.outer);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${vcfg.opacity})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 960, 640);
  },

  // ---- 全局闪烁 ----
  _applyFlicker(ctx, dt, fcfg) {
    if (Math.random() < fcfg.chance) {
      this.lightFlicker = 1.0 - fcfg.amount * Math.random();
    } else {
      // 平滑恢复
      this.lightFlicker += (1.0 - this.lightFlicker) * 0.1;
    }

    if (this.lightFlicker < 0.98) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = `rgb(${Math.floor(this.lightFlicker * 255)},${Math.floor(this.lightFlicker * 255)},${Math.floor(this.lightFlicker * 255)})`;
      ctx.fillRect(0, 0, 960, 640);
      ctx.restore();
    }
  },

  // ---- CRT 扫描线 ----
  _renderScanlines(ctx, scfg) {
    this.scanlineOffset = (this.scanlineOffset + 0.5) % 4;
    ctx.save();
    ctx.fillStyle = `rgba(0,0,0,${scfg.opacity})`;
    for (let y = this.scanlineOffset; y < 640; y += 4) {
      ctx.fillRect(0, y, 960, 1);
    }
    ctx.restore();
  },

  // ---- 偶发故障效果 ----
  _maybeGlitch(ctx, dt) {
    this.glitchTimer += dt;
    if (!this.glitchActive && this.glitchTimer > 8000 + Math.random() * 15000) {
      this.glitchActive = true;
      this.glitchTimer = 0;
      setTimeout(() => { this.glitchActive = false; }, 80 + Math.random() * 120);
    }

    if (this.glitchActive) {
      ctx.save();
      // 随机水平位移几行
      const sliceY = Math.floor(Math.random() * 600);
      const sliceH = 2 + Math.floor(Math.random() * 8);
      const shift = (Math.random() - 0.5) * 20;
      const imgData = ctx.getImageData(0, sliceY, 960, sliceH);
      ctx.putImageData(imgData, shift, sliceY);

      // 红/蓝色偏
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = `rgba(255, 0, 0, ${0.05 + Math.random() * 0.05})`;
      ctx.fillRect(0, 0, 960, 640);
      ctx.restore();
    }
  },
};


// ============================================================
// JOKER FACE ANIMATOR — 谐子的变幻笑脸
// ============================================================
const JokerFace = {
  canvas: null,
  ctx: null,
  running: false,
  time: 0,
  currentFace: 0,
  transitionProgress: 0,
  transitionSpeed: 0.4, // 0-1 per second
  glitchTimer: 0,
  glitchActive: false,

  // 笑脸关键帧 — 每一帧定义眉、眼、嘴的参数
  faces: [
    { // 0: 经典咧嘴笑
      name: 'grin',

      browL:    { angle: -0.1 },
      browR:    { angle: 0.1 },

    },
    { // 1: 眨眼 wink
      name: 'wink',
